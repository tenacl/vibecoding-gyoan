<p><em>AI와 대화하며 실제로 쓸 수 있는 서비스를 만드는 3일 집중 과정 — 이론부터 배포·운영까지</em></p>

<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EA%B3%BC%EC%A0%95-%EC%86%8C%EA%B0%9C">과정 소개</h2>
<p><em>WITH CLAUDE CODE · 3-DAY INTENSIVE</em></p>
<blockquote>
<p>AI와 대화하며 <strong>실제로 쓸 수 있는 서비스</strong>를 만드는 3일. 코딩 경험이 없어도 괜찮습니다 — 이론은 배운 즉시 손으로 만들어 확인합니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="3" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%9D%B4-%EA%B3%BC%EC%A0%95%EC%9D%98-3%EA%B0%80%EC%A7%80-%EC%95%BD%EC%86%8D">이 과정의 3가지 약속</h2>
<ul>
<li><strong>① 이론 → 즉시 실습</strong> — 모든 이론은 40분 이내로 끊고, 바로 써먹는 실습이 따라온다</li>
<li><strong>② 웹페이지에서 끝나지 않는다</strong> — 크롬 익스텐션, 데이터가 저장되는 앱까지 &quot;실제로 쓰는 형태&quot;로</li>
<li><strong>③ 진짜 저장되는 앱</strong> — 3일차에 DB를 붙인 노션 클론을 만들어 인터넷에 배포한다</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> 수업 전날까지 끝내야 할 준비물(계정 가입 등)이 있습니다 — 부록 「수강 전 준비 체크리스트」 먼저 확인<br />
<img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 실습 결과물은 패들렛에 올려 함께 공유해요</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="4" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="3%EC%9D%BC%EC%9D%98-%EC%97%AC%EC%A0%95">3일의 여정</h2>
<blockquote>
<p>(도식: 3일 로드맵 도식)</p>
</blockquote>
<ul>
<li><strong>DAY 1 · 기본기</strong> — 개발환경 · 웹의 구조 · 프롬프트 → 프로필 페이지 공개 + 게임 만들며 디버깅</li>
<li><strong>DAY 2 · 연결</strong> — API → 크롬 익스텐션, 공공 데이터 시각화+AI, 테스트 결제까지</li>
<li><strong>DAY 3 · 저장과 공개</strong> — DB 입문 → 진짜 저장되는 노션 클론 + Vercel 배포</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="5" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%9D%B4-%EA%B5%90%EC%95%88-%EC%82%AC%EC%9A%A9%EB%B2%95">이 교안 사용법</h2>
<ul>
<li>왼쪽 목차에서 진행 중인 세션 클릭 → 이동, 상단 검색창에 &quot;배포·API·결제&quot; 등으로 필터</li>
<li>어두운 상자 안 예시 프롬프트는 그대로 복사해 Claude에게 붙여넣어도 됨</li>
<li>오른쪽 메모장은 자동 저장 — 끝나면 MD로 다운로드</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 목차 맨 위 <strong>「이론 기초」 3장</strong>은 시간표에 묶인 세션이 아니라 <strong>3일 내내 참조하는 배경 지식</strong>입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="6" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h1 id="%EC%9D%B4%EB%A1%A0-%EA%B8%B0%EC%B4%88">이론 기초</h1>
<p><em>3일 내내 참조하는 배경 지식</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="7" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="ai%EA%B0%80-%EB%8B%B5%ED%95%98%EB%8A%94-%EC%9B%90%EB%A6%AC">AI가 답하는 원리</h2>
<h3 id="%ED%99%95%EB%A5%A0-%EA%B8%B0%EA%B3%84%EC%97%90%EC%84%9C-%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8%EA%B9%8C%EC%A7%80">확률 기계에서 프롬프트까지</h3>
<p><em>이론 기초 01</em></p>
<blockquote>
<p>AI가 <strong>왜</strong> 그렇게 답하는지 알면, <strong>어떻게</strong> 시켜야 하는지가 저절로 따라옵니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="8" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="llm%EC%9D%80-%EB%8B%A4%EC%9D%8C-%EB%A7%90%EC%9D%84-%ED%99%95%EB%A5%A0%EB%A1%9C-%EA%B3%A0%EB%A5%B4%EB%8A%94-%EA%B8%B0%EA%B3%84">LLM은 &quot;다음 말&quot;을 확률로 고르는 기계</h2>
<ul>
<li>110년 동안의 질문은 하나였습니다 — &quot;다음에 올 말은 무엇인가?&quot;</li>
<li>마르코프(1913) → 섀넌(1948) → 신경망 언어모델(2003) → 트랜스포머(2017) → ChatGPT(2022) → 에이전트(지금)</li>
<li>기술은 바뀌어도 원리는 그대로 — 앞의 말을 보고 다음 말을 확률로 예측한다</li>
</ul>
<blockquote>
<p>(도식: 문맥이 쌓일수록 확률 분포가 좁아지는 과정)</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="9" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%99%9C-%EA%B0%99%EC%9D%80-%EC%A7%88%EB%AC%B8%EC%97%90-%EB%A7%A4%EB%B2%88-%EB%8B%A4%EB%A5%B8-%EB%8B%B5%EC%9D%B4--%EC%83%98%ED%94%8C%EB%A7%81">왜 같은 질문에 매번 다른 답이 — 샘플링</h2>
<ul>
<li>AI는 1등만 고르지 않고 분포에서 추첨(샘플링)한다 — 가끔 2등·3등도 뽑힌다</li>
<li>답이 매번 달라지는 건 고장이 아니라 <strong>설계</strong>다</li>
<li>창의성과 환각은 같은 다이얼의 양 끝 — 추첨 폭을 넓히면 창의적, 너무 넓히면 헛소리</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="10" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%ED%99%98%EA%B0%81%ED%95%A0%EB%A3%A8%EC%8B%9C%EB%84%A4%EC%9D%B4%EC%85%98--%EC%9B%90%EB%A6%AC%EC%83%81-%ED%94%BC%ED%95%A0-%EC%88%98-%EC%97%86%EB%8A%94-%EA%B2%83">환각(할루시네이션) — 원리상 피할 수 없는 것</h2>
<ul>
<li>학습에 없는 걸 물어도 AI는 &quot;그럴듯한 다음 단어&quot;를 지어낸다 — 없는 함수·링크·판례를 자신 있게</li>
<li>확률 예측 방식의 필연적 결과라서, 프롬프트를 잘 쓴다고 사라지지 않는다</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> 이 문제의 답은 과정 마지막에 — 도구로 사실을 확인하게 만드는 것(이론 03 RAG). 지금은 &quot;이런 문제가 있다&quot;만 기억</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="11" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8%EB%8A%94-%ED%99%95%EB%A5%A0%EC%9D%84-%EC%A2%81%ED%9E%88%EB%8A%94-%ED%96%89%EC%9C%84">프롬프트는 &quot;확률을 좁히는 행위&quot;</h2>
<table>
<thead>
<tr>
<th></th>
<th>막연한 요청</th>
<th>구체적인 요청</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>예시</strong></td>
<td>&quot;맛있는 거 주세요&quot;</td>
<td>&quot;매운 것 빼고, 둘이서 3만 원어치&quot;</td>
</tr>
<tr>
<td><strong>확률 분포</strong></td>
<td>평평함 — 후보가 너무 많다</td>
<td>뾰족함 — 후보가 좁혀진다</td>
</tr>
<tr>
<td><strong>결과</strong></td>
<td>그럴듯한 <strong>평균</strong>이 나온다</td>
<td>내가 원하던 것이 나온다</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="12" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="ptcf--%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8%EB%A5%BC-%EA%B5%AC%EC%B2%B4%EC%A0%81%EC%9C%BC%EB%A1%9C-%EC%93%B0%EB%8A%94-%ED%8B%80">PTCF — 프롬프트를 구체적으로 쓰는 틀</h2>
<table>
<thead>
<tr>
<th>요소</th>
<th>묻는 질문</th>
<th>예시</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>P</strong>ersona</td>
<td>누구로서?</td>
<td>&quot;당신은 동네 카페 마케터&quot;</td>
</tr>
<tr>
<td><strong>T</strong>ask</td>
<td>무엇을?</td>
<td>&quot;홍보 문구를 3개 써 주세요&quot;</td>
</tr>
<tr>
<td><strong>C</strong>ontext</td>
<td>어떤 상황에서?</td>
<td>&quot;손님 대부분 출근길 30대 직장인&quot;</td>
</tr>
<tr>
<td><strong>F</strong>ormat</td>
<td>어떤 모양으로?</td>
<td>&quot;문구당 두 문장, 해시태그 3개씩&quot;</td>
</tr>
</tbody>
</table>
<ul>
<li>매번 다 채울 필요는 없다 — 쓰기 전에 네 칸을 떠올리는 습관이 핵심</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="13" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="tcrei--%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8%EB%A5%BC-%EA%B3%84%EC%86%8D-%EA%B3%A0%EC%B3%90%EA%B0%80%EB%8A%94-%ED%8B%80">TCREI — 프롬프트를 계속 고쳐가는 틀</h2>
<table>
<thead>
<tr>
<th>요소</th>
<th>뜻</th>
<th>성격</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>T</strong>ask</td>
<td>할 일을 한 문장으로</td>
<td>넣는 <strong>재료</strong></td>
</tr>
<tr>
<td><strong>C</strong>ontext</td>
<td>대상·배경·조건</td>
<td>넣는 <strong>재료</strong></td>
</tr>
<tr>
<td><strong>R</strong>eferences</td>
<td>예시·원문·양식을 함께</td>
<td>넣는 <strong>재료</strong></td>
</tr>
<tr>
<td><strong>E</strong>valuate</td>
<td>결과를 <strong>채점</strong>한다</td>
<td>받은 뒤 <strong>사람의 행동</strong></td>
</tr>
<tr>
<td><strong>I</strong>terate</td>
<td>어긋난 부분만 <strong>다시 시킨다</strong></td>
<td>받은 뒤 <strong>사람의 행동</strong></td>
</tr>
</tbody>
</table>
<ul>
<li>잘 쓰는 사람과 못 쓰는 사람은 뒤의 두 칸(E·I)에서 갈린다</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="14" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="example--evaluate-%E2%86%92-iterate">EXAMPLE — Evaluate → Iterate</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>1차 결과 채점: 순서 ○, 색 ○, 대표 메뉴 ✕ (세상 카페의 평균이 나옴)

→ 어긋난 칸만 짚어서 다시:
&quot;대표 메뉴를 흑임자 라떼·수제 스콘·핸드드립으로 바꿔 주세요. 나머지는 그대로.&quot;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="15" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8%EB%A5%BC-%EA%B5%AC%EC%A1%B0%ED%99%94%ED%95%98%EB%8A%94-3%EA%B0%80%EC%A7%80-%ED%98%95%EC%8B%9D">프롬프트를 구조화하는 3가지 형식</h2>
<p>형식 없는 긴 글은 AI에게 &quot;다 한 줄&quot;로 보입니다. 구역을 나눠주면 조건이 섞이지 않습니다.</p>
<table>
<thead>
<tr>
<th>형식</th>
<th>비유</th>
<th>언제</th>
<th>대표 예</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>마크다운</strong></td>
<td>형광펜</td>
<td>매일 씀</td>
<td>CLAUDE.md, 이 교안</td>
</tr>
<tr>
<td><strong>XML 태그</strong></td>
<td>벽</td>
<td>가끔</td>
<td><code>&lt;자료&gt;붙여넣은 글&lt;/자료&gt;</code></td>
</tr>
<tr>
<td><strong>JSON</strong></td>
<td>자물쇠</td>
<td>알아만 두기</td>
<td>API 응답, 툴 정의서</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 긴 자료는 <code>&lt;자료&gt; … &lt;/자료&gt;</code>로 감싸세요 — AI가 자료 속 문장을 지시로 오해하는 사고를 막아줍니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="16" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%A7%88%ED%81%AC%EB%8B%A4%EC%9A%B4-%EC%B5%9C%EC%86%8C-%EB%AC%B8%EB%B2%95-5%EA%B0%9C--%EC%9D%B4%EA%B1%B0%EB%A9%B4-%EC%B6%A9%EB%B6%84">마크다운 최소 문법 5개 — 이거면 충분</h2>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="17" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%9D%B4%EB%A1%A0-01--%EB%8D%94-%EA%B9%8A%EC%9D%B4-%EC%B0%B8%EA%B3%A0-%EC%9E%90%EB%A3%8C">이론 01 — 더 깊이 (참고 자료)</h2>

<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%97%90%EC%9D%B4%EC%A0%84%ED%8A%B8%EC%99%80-%ED%95%98%EB%84%A4%EC%8A%A4">에이전트와 하네스</h2>
<p><em>이론 기초 02</em></p>
<blockquote>
<p>확률 기계에 <strong>도구·기억·순환</strong>을 붙이면 에이전트가 됩니다. 그 에이전트가 일할 환경을 짜는 것이 하네스 엔지니어링입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="19" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%B1%97%EB%B4%87%EA%B3%BC-%EC%97%90%EC%9D%B4%EC%A0%84%ED%8A%B8--%EA%B8%B0%EC%A4%80%EC%9D%80-%EB%94%B1-%ED%95%98%EB%82%98">챗봇과 에이전트 — 기준은 딱 하나</h2>
<p>기능 개수가 아니라 **&quot;다음 단계를 누가 정하는가&quot;**로 가릅니다.</p>
<table>
<thead>
<tr>
<th></th>
<th>챗봇</th>
<th>에이전트</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>다음 단계 결정</strong></td>
<td>사람</td>
<td>AI</td>
</tr>
<tr>
<td><strong>비유</strong></td>
<td>말하는 백과사전</td>
<td>일을 통째로 맡은 담당자</td>
</tr>
<tr>
<td><strong>&quot;매출 요약해줘&quot;</strong></td>
<td>방법 알려주고 끝</td>
<td>찾기→계산→표→검토를 스스로 반복</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 앤트로픽 정의: &quot;환경 피드백을 받으며 루프 안에서 도구를 쓰는 LLM&quot;</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="20" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%97%90%EC%9D%B4%EC%A0%84%ED%8A%B8%EC%9D%98-%EA%B5%AC%EC%84%B1%EC%9A%94%EC%86%8C">에이전트의 구성요소</h2>
<table>
<thead>
<tr>
<th>구성요소</th>
<th>역할</th>
<th>없으면</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>추론 모델</strong></td>
<td>다음에 뭘 할지 판단하는 두뇌</td>
<td>아무 결정도 못 함</td>
</tr>
<tr>
<td><strong>툴(도구)</strong></td>
<td>세상을 읽고 바꾸는 손</td>
<td>판단만 하고 안 바뀜</td>
</tr>
<tr>
<td><strong>메모리</strong></td>
<td>한 일과 알게 된 것을 담는 곳</td>
<td>매번 처음부터 다시</td>
</tr>
<tr>
<td><strong>(루프)</strong></td>
<td>될 때까지 반복하고 다 되면 멈춤</td>
<td>챗봇에 그침</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="21" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%97%90%EC%9D%B4%EC%A0%84%ED%8B%B1%ED%95%98%EB%8B%A4%EB%8A%94-%EB%AC%B4%EC%8A%A8-%EB%9C%BB%EC%9D%BC%EA%B9%8C">&quot;에이전틱하다&quot;는 무슨 뜻일까</h2>
<ul>
<li>시킨 하나만 하고 멈추는 게 아니라, 목표를 위해 스스로 여러 단계를 밟을 때 &quot;에이전틱하다&quot;</li>
<li>비유 — 심부름에서 &quot;재료 없으면 사 오고, 대체품 찾고, 다 되면 알려주는&quot; 사람</li>
<li>&quot;재료 없던데요?&quot; 하고 멈추면 에이전틱하지 않은 것 — 명령받으면 계획→실행→판단을 반복</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="22" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="gram-%EB%A3%A8%ED%94%84--%EC%97%90%EC%9D%B4%EC%A0%84%ED%8A%B8%EA%B0%80-%EB%8F%84%EB%8A%94-%EC%88%9C%ED%99%98">GRAM 루프 — 에이전트가 도는 순환</h2>
<blockquote>
<p>(도식: GRAM 루프 순환 도식)</p>
</blockquote>
<ul>
<li>클로드 코드 화면의 &quot;파일 읽는 중&quot;, &quot;명령 실행 중&quot;이 이 순환 — 무서운 로그가 아니라 진행 표시</li>
<li>GRAM은 외울 표가 아니라 이름표 — &quot;지금 Reason 중이구나&quot;라고 부를 수 있으면 충분</li>
<li>영어 자료: agent loop, 학술 원전은 ReAct(Yao et al. 2022)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="23" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%ED%88%B4%EB%A1%9C-%EC%93%B8-%EC%88%98-%EC%9E%88%EB%8A%94-%EA%B2%83%EB%93%A4">툴로 쓸 수 있는 것들</h2>
<ul>
<li>파일 읽기·쓰기·수정 / 명령 실행(터미널) / 검색(파일·웹) / 브라우저 조작 / 외부 서비스(노션·깃허브·DB)</li>
<li>외부 서비스를 붙이는 표준 규격이 <strong>MCP</strong>(Model Context Protocol) — AI에게 손·눈을 달아주는 것</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="24" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%A9%94%EB%AA%A8%EB%A6%AC--%EB%8B%A8%EA%B8%B0%EC%99%80-%EC%9E%A5%EA%B8%B0">메모리 — 단기와 장기</h2>
<table>
<thead>
<tr>
<th></th>
<th>단기 메모리</th>
<th>장기 메모리</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>실체</strong></td>
<td>컨텍스트 윈도우 — 지금 대화에 올라온 것</td>
<td>기록 — 파일에 적어둔 것</td>
</tr>
<tr>
<td><strong>수명</strong></td>
<td>대화 끝나면 사라짐</td>
<td>다음 대화에서도 읽어 씀</td>
</tr>
<tr>
<td><strong>예</strong></td>
<td>방금 대화, 읽은 파일</td>
<td>CLAUDE.md, 작업 노트, 회고</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="25" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%BB%A8%ED%85%8D%EC%8A%A4%ED%8A%B8--%ED%95%9C%EA%B5%AD%EC%96%B4%EB%A1%9C-%EB%A7%A5%EB%9D%BD">컨텍스트 — 한국어로 &quot;맥락&quot;</h2>
<ul>
<li>AI가 지금 대화를 이해하려고 참고하는 모든 것 — 질문·앞선 대화·읽은 파일·붙여넣은 자료</li>
<li>AI에겐 눈치도 배경지식도 없어 컨텍스트에 올라온 것만 안다 — &quot;무엇을 넣어주느냐&quot;가 결과를 좌우</li>
<li>이 컨텍스트를 담는 그릇의 크기가 컨텍스트 윈도우</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> [캡처: 클로드 공식 컨텍스트 윈도우 설명 이미지]</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="26" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%BB%A8%ED%85%8D%EC%8A%A4%ED%8A%B8-%EC%9C%88%EB%8F%84%EC%9A%B0--%EC%99%9C-%EC%83%88-%EC%A3%BC%EC%A0%9C%EB%8A%94-%EC%83%88-%EC%B1%84%ED%8C%85%EC%9D%B8%EA%B0%80">컨텍스트 윈도우 — 왜 새 주제는 새 채팅인가</h2>
<ul>
<li>AI가 한 번에 기억할 수 있는 양 — 무한하지 않다</li>
<li>꽉 차기 <strong>전부터</strong> 품질이 떨어진다 — 시행착오·버린 코드가 쌓이면 답이 평균으로 흐른다</li>
<li>그래서 주제가 바뀌면 새 채팅 — 넘쳐서가 아니라 흐려지기 전에 끊는 것</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="27" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%ED%86%A0%ED%81%B0--%EC%84%B8-%EA%B0%88%EB%9E%98%EB%A1%9C-%EB%82%98%EB%88%A0-%EB%B3%B4%EA%B8%B0">토큰 — 세 갈래로 나눠 보기</h2>
<table>
<thead>
<tr>
<th>구분</th>
<th>무엇인가</th>
<th>알아둘 점</th>
</tr>
</thead>
<tbody>
<tr>

</table>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="28" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%BB%A8%ED%85%8D%EC%8A%A4%ED%8A%B8-%EC%97%94%EC%A7%80%EB%8B%88%EC%96%B4%EB%A7%81">컨텍스트 엔지니어링</h2>
<ul>
<li>&quot;이 작업에 어떤 컨텍스트를 줘야 하는가?&quot; — 필요한 건 넣고, 없는 건 빼고, 순서를 정하는 것</li>
<li>이 고민 자체를 컨텍스트 엔지니어링이라 부른다</li>
<li>많이 넣는 게 좋은 게 아니다 — 관계없는 자료는 분포를 흐리고 비용만 늘린다</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="29" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%97%90%EC%9D%B4%EC%A0%84%ED%8A%B8-%EB%AC%B8%EC%84%9C--%EA%B7%9C%EC%B9%99%EC%9D%84-%EC%96%B4%EB%94%94%EC%97%90-%EC%A0%81%EC%96%B4%EB%91%90%EB%82%98">에이전트 문서 — 규칙을 어디에 적어두나</h2>
<p><strong>로드되는 시점이 서로 다르다</strong>는 게 핵심입니다.</p>
<blockquote>
<p>(도식: 에이전트 문서의 3단 로딩 구조)</p>
</blockquote>
<table>
<thead>
<tr>
<th>문서</th>
<th>정체</th>
<th>로드 시점</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>CLAUDE.md</strong> (범용: AGENTS.md)</td>
<td>프로젝트 규칙 문서</td>
<td>새 작업마다 <strong>항상</strong></td>
</tr>
<tr>
<td><strong>Rules</strong></td>
<td>주제별 규칙 파일</td>
<td>해당 경로 파일 다룰 때만</td>
</tr>
<tr>
<td><strong>Skills</strong> (<code>SKILL.md</code>)</td>
<td>작업 절차 지시서</td>
<td>필요할 때 <strong>찾아서</strong></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="30" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%AC%B8%EC%84%9C-vs-%ED%9B%85">문서 vs 훅</h2>
<ul>
<li>지침서가 길면 실제 작업에 쓸 컨텍스트가 줄어든다 → 개념 단위로 쪼개 필요할 때 찾아 쓰게 (Skills가 그 해법)</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>Hooks는 문서가 아니다</strong> — 정해진 시점에 반드시 실행되는 자동 명령(코드), 컨텍스트도 안 차지</li>
<li>문서 3종이 부탁이라면 훅은 강제</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="31" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%ED%95%98%EB%84%A4%EC%8A%A4-%EC%97%94%EC%A7%80%EB%8B%88%EC%96%B4%EB%A7%81">하네스 엔지니어링</h2>
<ul>
<li>하네스 = 말을 부릴 때 쓰는 장비. 에이전트가 일할 프로젝트 환경 전체를 설계하는 것</li>
<li>무엇을 짜나 — 규칙 문서, 권한 범위, 도구, 강제 장치(훅), 결과 확인 방법</li>
<li>같은 AI라도 잘 짜인 하네스에서 훨씬 잘 일한다 — 모델보다 환경을 고치는 게 빠를 때가 많다</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="32" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%9D%B4%EB%A1%A0-02--%EB%8D%94-%EA%B9%8A%EC%9D%B4-%EC%B0%B8%EA%B3%A0-%EC%9E%90%EB%A3%8C">이론 02 — 더 깊이 (참고 자료)</h2>
<ul>
<li>Building Effective Agents (Anthropic 공식, 영문)</li>
<li>ReAct — GRAM 루프의 학술 원전 (Yao et al. 2022)</li>
<li>CLAUDE.md(메모리) 공식 문서</li>
<li>Skill 공식 문서 / Hooks 공식 가이드</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="33" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="rag%EC%99%80-%EC%97%90%EC%9D%B4%EC%A0%84%ED%8B%B1-%EC%84%9C%EC%B9%98">RAG와 에이전틱 서치</h2>
<h3 id="%ED%99%98%EA%B0%81%EC%97%90-%EB%8C%80%ED%95%9C-%EB%8B%B5">환각에 대한 답</h3>
<p><em>이론 기초 03</em></p>
<blockquote>
<p>이론 01의 문제 — <strong>AI는 모르는 것도 그럴듯하게 지어냅니다.</strong> 그 답이 여기 있습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="34" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%8B%B5%EC%9D%80-%EC%A7%80%EC%96%B4%EB%82%B4%EC%A7%80-%EB%A7%90%EA%B3%A0-%EC%B0%BE%EC%95%84%EB%B3%B4%EA%B2%8C-%ED%95%98%EB%8A%94-%EA%B2%83">답은 &quot;지어내지 말고, 찾아보게 하는 것&quot;</h2>
<ul>
<li>확률로 만들어내는 대신, 실제 자료를 읽고 그걸 근거로 답하게 만든다</li>
<li>이게 도구(툴)가 존재하는 근본 이유 — 검색·파일 읽기·코드 실행으로 사실 확인</li>
<li>앤트로픽이 에이전트를 &quot;환경 피드백을 받으며 루프를 도는 LLM&quot;이라 정의하는 이유 (환경 피드백 = 사실 확인)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="35" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="rag--%EA%B2%80%EC%83%89%ED%95%B4%EC%84%9C-%EA%B7%BC%EA%B1%B0%EB%A5%BC-%EB%B6%99%EC%9D%B8-%EB%92%A4-%EB%8B%B5%ED%95%98%EA%B8%B0">RAG — 검색해서 근거를 붙인 뒤 답하기</h2>
<ul>
<li>RAG = Retrieval-Augmented Generation, &quot;검색으로 보강한 생성&quot;</li>
<li>흐름: 질문 → 관련 자료 먼저 찾고 → 함께 넣어서 → 답한다</li>
<li>오해 — RAG는 벡터 DB를 뜻하는 게 아니다. 클로드 코드가 내 폴더에서 파일을 찾아 읽는 것도 넓은 RAG</li>
</ul>
<blockquote>
<p><strong><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> RAG는 환각을 없애지 않습니다.</strong> 찾아온 자료가 틀릴 수도, 잘못 읽을 수도 있습니다. RAG는 <strong>근거를 붙여 검증 가능하게</strong> 만들 뿐 — 오히려 결과를 확인하는 습관이 더 중요해집니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="36" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%97%90%EC%9D%B4%EC%A0%84%ED%8B%B1-%EC%84%9C%EC%B9%98--%EA%B2%80%EC%83%89%EC%9D%84-%EC%97%90%EC%9D%B4%EC%A0%84%ED%8A%B8%EA%B0%80-%EC%8A%A4%EC%8A%A4%EB%A1%9C">에이전틱 서치 — 검색을 에이전트가 스스로</h2>
<blockquote>
<p>(도식: RAG와 에이전틱 서치 비교)</p>
</blockquote>
<ul>
<li>RAG는 정해진 방식으로 한 번 찾아 넣는다. 에이전틱 서치는 무엇을 찾을지 스스로 판단하고 부족하면 다시 찾는다</li>
<li>대체가 아니라 겹쳐 쓰는 관계 — 에이전틱 서치 = RAG + GRAM 루프</li>
<li>기준은 낯익다 — &quot;다음 단계를 누가 정하는가&quot;(이론 02)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="37" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="llm-%EC%9C%84%ED%82%A4--%EC%B0%BE%EC%95%84-%EC%93%B8-%EC%A7%80%EC%8B%9D%EC%9D%84-%EC%95%84%EC%98%88-%EC%8C%93%EC%95%84%EB%91%90%EA%B8%B0">LLM 위키 — 찾아 쓸 지식을 아예 쌓아두기</h2>
<ul>
<li>RAG가 &quot;필요할 때 찾아온다&quot;면, 찾아올 대상을 미리 잘 만들어두자는 흐름 = LLM 위키</li>
<li>거창하지 않다 — 마크다운 파일을 폴더로 정리한 것 (용어·절차·과거 사고 기록)</li>
<li>CLAUDE.md도 그중 하나. 구글이 공통 규격으로 정리한 것이 OKF(Open Knowledge Format)</li>
<li>회사에 진짜 필요한 건 내부 지식 — AI가 학습한 적 없다. 위키에 쌓아두면 매번 설명 안 해도 됨</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> LLM 위키는 이론 02의 <strong>장기 메모리를 개인에서 팀·조직 단위로 넓힌 것</strong>입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="38" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%BB%A8%ED%85%8D%EC%8A%A4%ED%8A%B8-%EC%97%94%EC%A7%80%EB%8B%88%EC%96%B4%EB%A7%81%EA%B3%BC%EC%9D%98-%EA%B4%80%EA%B3%84">컨텍스트 엔지니어링과의 관계</h2>
<ul>
<li>이론 02: 컨텍스트 엔지니어링 = &quot;어떤 컨텍스트를 줄지 고민하는 것&quot;</li>
<li>RAG는 그 고민을 자동화한 것 — 사람이 고르던 자료를 시스템이 질문에 맞춰 대신 찾아 넣음</li>
<li>다 넣으면 흐려지고, 안 넣으면 지어낸다 — 그 사이를 푸는 게 RAG</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 3일 과정 한 줄 요약 — <strong>확률 기계(01) → 잘 시키는 법(프롬프트) → 도구·순환을 붙여 에이전트로(02) → 사실을 확인하게(03)</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="39" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">

<h2 id="%EB%B0%94%EC%9D%B4%EB%B8%8C%EC%BD%94%EB%94%A9--%ED%95%B5%EC%8B%AC-%EB%82%B4%EC%9A%A9">바이브코딩 — 핵심 내용</h2>

<li>필요한 실력 — 문법 암기 <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> / 원하는 걸 정확히 설명하고 결과를 판단하는 능력 <img class="emoji" draggable="false" alt="⭕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2b55.svg" data-marp-twemoji=""/></li>
<li>코드를 몰라도 시작하지만, 웹의 큰 그림은 알아야 잘 시킨다 (오전에 배움)</li>
<li>로드맵: Day1 공개 → Day2 API 연결 → Day3 DB로 저장되는 앱</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="46" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%B0%94%EC%9D%B4%EB%B8%8C%EC%BD%94%EB%94%A9%EC%9D%B4%EB%9D%BC%EB%8A%94-%EB%A7%90%EC%9D%80-%EC%96%B4%EB%94%94%EC%84%9C">&quot;바이브코딩&quot;이라는 말은 어디서</h2>
<blockquote>
<p>코드를 직접 써 내려가는 일이 아니라, 코딩 에이전트와 대화하며 만들고 싶은 결과물을 정확히 설명하고 이해시키는 일.</p>
</blockquote>
<ul>
<li>OpenAI 창립 멤버 안드레이 카파시가 2025년 초 처음 꺼낸 말 — &quot;흐름(vibe)에 몸을 맡기고 AI에게 시키며 만든다&quot;</li>
<li>핵심은 타이핑이 아니라 &quot;무엇을, 왜 만들고 싶은지&quot;를 또렷하게 전달하는 힘 (주방장에게 정확히 주문하는 손님)</li>
<li>&quot;설명하고 → 확인하고 → 다시 요청하는&quot; 감각이 3일 내내 기를 진짜 실력</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="47" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">

<h2 id="%EC%9D%BC%EB%B0%98-%EC%B1%97%EB%B4%87%EA%B3%BC-%EB%AD%90%EA%B0%80-%EB%8B%A4%EB%A5%B8%EA%B0%80">일반 챗봇과 뭐가 다른가</h2>
<table>
<thead>
<tr>
<th></th>
<th>일반 챗봇</th>
<th>클로드 코드</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>역할</strong></td>
<td>조언하는 컨설턴트</td>

</tr>
<tr>
<td><strong>코드</strong></td>

</tr>
<tr>

</tr>
<tr>
<td><strong>에러</strong></td>

</tr>
<tr>

<td>매번 복붙 왕복</td>
<td>&quot;가계부 만들어줘&quot; → 2~5분 완성</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="48" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%AF%B8%EB%A6%AC-%EC%95%8C%EC%95%84%EB%91%90%EB%A9%B4-%EB%A7%88%EC%9D%8C-%ED%8E%B8%ED%95%9C-%EA%B2%83-2%EA%B0%80%EC%A7%80">미리 알아두면 마음 편한 것 2가지</h2>
<ul>
<li>AI는 확률 기계다 — 매번 조금씩 다른 답은 고장이 아니라 설계. 맥락을 많이 줄수록 정확해진다</li>
<li>정말 어려운 건 개발이 아니라 <strong>가입·설치·연결</strong>이다 — 막히는 게 정상, 여러분 잘못이 아니니 바로 손 들자</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="49" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">

<blockquote>
<p>아래 6단계를 한 바퀴 돌리면 결과물 하나가 나옵니다. 3일 동안 이 바퀴를 계속 돌립니다.</p>
</blockquote>
<blockquote>
<p>(도식: 폴더 생성 → Plan → Build → 검토·개선 → 배포 → 공유, 반복)</p>
</blockquote>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 한 번 쓰고 버리는 순서가 아닙니다 — <strong>작은 결과물마다 ①~⑥을 반복</strong>. 몸에 배면 여러분만의 서비스도 같은 방식으로.<br />
<img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 오늘의 약속 — 퇴근 전에 각자의 웹페이지가 인터넷에 올라갑니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="50" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">

<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EA%B0%9C%EB%B0%9C%ED%99%98%EA%B2%BD-%EA%B5%AC%EC%84%B1--%EC%B2%AB-%ED%8E%98%EC%9D%B4%EC%A7%80-%EB%A7%8C%EB%93%A4%EA%B8%B0">개발환경 구성 + 첫 페이지 만들기</h2>

<p>Claude를 쓰는 3가지 방법을 알아보고, 수업용 환경을 세팅해 첫 결과물을 띄웁니다.</p>

<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="claude%EB%A5%BC-%EC%93%B0%EB%8A%94-3%EA%B0%80%EC%A7%80-%EC%B0%BD%EA%B5%AC">Claude를 쓰는 3가지 창구</h2>
<table>
<thead>
<tr>
<th>환경</th>
<th>모습</th>
<th>어울리는 일</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>데스크톱 앱</strong></td>
<td>메신저처럼 대화</td>
<td>질문, 아이디어, 문서</td>
</tr>
<tr>
<td><strong>VS Code 확장</strong></td>
<td>편집기 안의 Claude</td>

</tr>
<tr>
<td><strong>Claude Code (터미널)</strong></td>
<td>명령어 창의 에이전트</td>
<td>파일 생성·수정 자동 — 가장 강력</td>
</tr>
</tbody>
</table>
<ul>
<li>수업은 한 가지 환경으로 전원 통일 — 지금부터 다 같이 설치</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="53" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%94%B0%EB%9D%BC%ED%95%98%EA%B8%B0-%E2%91%A0--%EC%9C%88%EB%8F%84%EC%9A%B0%EC%97%90-claude-code-%EC%84%A4%EC%B9%98">따라하기 ① — 윈도우에 Claude Code 설치</h2>
<ol>
<li>Claude 유료 구독(Pro 이상) 로그인 가능 확인 (무료면 지금 업그레이드)</li>
<li>윈도우 키 → &quot;powershell&quot; → Enter</li>
<li>아래 명령어 붙여넣고(우클릭=붙여넣기) Enter — 자동 설치</li>
<li>설치 후 PowerShell 창 닫았다 새로 열기</li>
<li><code>claude --version</code> → 버전 나오면 성공</li>
<li><code>claude</code> → 브라우저 로그인 → 코드 붙여넣기 → &quot;Login successful&quot;</li>
</ol>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>irm https://claude.ai/install.ps1 | iex
</code></pre>
<ul>
<li>참고: Node.js 있으면 <code>npm install -g @anthropic-ai/claude-code</code>도 가능 (오늘은 위 방식 통일)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="54" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%ED%99%98%EA%B2%BD%EB%B3%80%EC%88%98--%EC%BB%B4%ED%93%A8%ED%84%B0-%EC%A0%84%EC%B2%B4%EA%B0%80-%EA%B8%B0%EC%96%B5%ED%95%98%EB%8A%94-%EC%84%A4%EC%A0%95">환경변수 — 컴퓨터 전체가 기억하는 설정</h2>
<ul>
<li>환경변수 = 특정 프로그램이 아니라 <strong>컴퓨터 전체에 붙여두는 메모</strong>. 어떤 프로그램이든 읽을 수 있다</li>
<li>대표적인 게 <strong>Path</strong> — &quot;명령어를 치면 어느 폴더에서 찾을지&quot; 목록. <code>claude</code>만 쳐도 실행되는 이유</li>
<li><code>claude</code> 명령을 못 찾는 에러 = Path에 설치 폴더가 등록 안 된 것 → 직접 등록하면 해결</li>
<li>내일(Day 2) API 키도 환경변수로 보관 — 코드에 키를 안 적는 안전한 방법</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="55" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%94%B0%EB%9D%BC%ED%95%98%EA%B8%B0-%E2%91%A1--path-%EB%93%B1%EB%A1%9D%ED%95%98%EA%B8%B0">따라하기 ② — Path 등록하기</h2>
<ol>
<li><code>claude --version</code>이 잘 나왔다면 건너뛰어도 됨 (에러 날 때만)</li>
<li>윈도우 키 → &quot;환경 변수&quot; 검색 → &quot;시스템 환경 변수 편집&quot; → [환경 변수] 버튼</li>
<li>&quot;사용자 변수&quot;에서 Path 선택 → [편집]</li>
<li>[새로 만들기] → 아래 경로 입력 → 확인</li>
<li>PowerShell 새로 열고 <code>claude --version</code> 확인</li>
</ol>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>%USERPROFILE%\.local\bin
</code></pre>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 새 환경변수도 같은 창에서 — &quot;사용자 변수&quot;의 [새로 만들기]. 내일 API 키 보관 때 다시 만납니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="56" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%ED%84%B0%EB%AF%B8%EB%84%90%EC%9D%B4%EB%9E%80--%EB%A7%88%EC%9A%B0%EC%8A%A4-%EB%8C%80%EC%8B%A0-%EB%A7%90%EB%A1%9C-%EC%8B%9C%ED%82%A4%EB%8A%94-%EC%B0%BD">터미널이란 — 마우스 대신 '말로' 시키는 창</h2>
<ul>
<li>터미널(PowerShell) = 마우스로 하던 일을 글자 명령어로 시키는 프로그램 (더블클릭 대신 <code>cd 폴더명</code>)</li>
<li>검은 화면이 낯설 뿐 어렵지 않다 — 외울 명령어는 대여섯 개, 나머지는 Claude가 알아서</li>
<li>왜 배우나 — 가장 강력한 Claude Code가 이 터미널 위에서 돈다</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> [캡처/짤: 매트릭스에서 트리니티가 터미널로 해킹하는 장면] — 영화 속 그 검은 창이 바로 터미널</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="57" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%99%9C-%EC%BD%94%EB%94%A9-%EC%97%90%EC%9D%B4%EC%A0%84%ED%8A%B8%EC%97%90%EA%B2%90-%ED%84%B0%EB%AF%B8%EB%84%90%EC%9D%B4-%EC%9E%98-%EB%A7%9E%EB%82%98">왜 코딩 에이전트에겐 터미널이 잘 맞나</h2>
<ul>
<li>Claude 같은 LLM은 '언어'를 학습한 모델 — 그림보다 글로 주고받을 때 가장 빠르고 정확</li>
<li>터미널은 모든 작업이 글자로 오간다 → 마우스 화면 조작보다 AI에겐 훨씬 효율적</li>
<li>정리 — 사람에겐 마우스, AI에겐 터미널. 그래서 일 잘하는 AI 도구가 터미널에서 돈다</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="58" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%9E%90%EC%A3%BC-%EC%93%B0%EB%8A%94-%ED%84%B0%EB%AF%B8%EB%84%90-%EB%AA%85%EB%A0%B9%EC%96%B4-%EC%9D%B4%EA%B2%83%EB%A7%8C">자주 쓰는 터미널 명령어 (이것만)</h2>
<table>
<thead>
<tr>
<th>명령어</th>
<th>하는 일</th>
<th>예시</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>cd 폴더명</code></td>
<td>폴더 안으로 들어가기</td>
<td><code>cd vibe-day1</code></td>
</tr>
<tr>
<td><code>cd ..</code></td>
<td>위 폴더로 나가기</td>
<td><code>cd ..</code></td>
</tr>
<tr>
<td><code>ls</code> (윈도우 <code>dir</code>)</td>
<td>파일 목록 보기</td>
<td><code>ls</code></td>
</tr>
<tr>
<td><code>pwd</code></td>
<td>지금 위치 전체 주소</td>
<td><code>pwd</code></td>
</tr>
<tr>
<td><code>mkdir 이름</code></td>
<td>새 폴더 만들기</td>
<td><code>mkdir images</code></td>
</tr>
<tr>
<td><code>cls</code> / <code>clear</code></td>
<td>화면 청소</td>
<td><code>cls</code></td>
</tr>
</tbody>
</table>
<ul>
<li>제일 많이 쓰는 건 <code>cd</code> 하나. 나머지는 &quot;이런 게 있었지&quot; 정도면 됨</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="59" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%A0%88%EB%8C%80%EA%B2%BD%EB%A1%9C-vs-%EC%83%81%EB%8C%80%EA%B2%BD%EB%A1%9C">절대경로 vs 상대경로</h2>
<p>비유 — 집 알려주기: ① &quot;서울시 ○○구 12&quot;(절대) ② &quot;오른쪽 두 번째 골목&quot;(상대)</p>
<table>
<thead>
<tr>
<th>구분</th>
<th>뜻</th>
<th>예시</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>절대경로</strong></td>
<td>뿌리(드라이브)부터 전체 주소 — 딱 한 곳</td>
<td><code>C:\Users\내이름\...\index.html</code></td>
</tr>
<tr>
<td><strong>상대경로</strong></td>
<td>지금 위치 기준 짧은 주소</td>
<td><code>index.html</code> · <code>images/logo.png</code> · <code>../</code></td>
</tr>
</tbody>
</table>
<ul>
<li>Claude가 &quot;경로를 못 찾겠다&quot;면 대부분 위치 착각 → <code>pwd</code> 확인 또는 절대경로로</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="60" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%A1%9C%EC%BB%AC%ED%98%B8%EC%8A%A4%ED%8A%B8--%ED%8F%AC%ED%8A%B8--%EC%84%9C%EB%B2%84">로컬호스트 · 포트 · 서버</h2>
<ul>
<li><strong>서버</strong> = 24시간 켜져 있는 컴퓨터. 인스타 접속 = 저쪽 서버가 화면을 내려주는 것</li>
<li><strong>로컬호스트(localhost)</strong> = 내 컴퓨터 자신(127.0.0.1). 공개 전 나만 보는 '내 컴퓨터 미리보기'</li>
<li><strong>포트(port)</strong> = 건물의 문 번호. 여러 프로그램이 &quot;3000번 문, 5500번 문&quot; 식으로 나눠 씀</li>
<li><code>http://localhost:3000</code> = &quot;내 컴퓨터의 3000번 문으로 들어와&quot; — 겁먹지 말고 주소창에 붙여넣기</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>서버 = 늘 켜진 컴퓨터, 로컬호스트 = 내 컴퓨터, 포트 = 문 번호</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="61" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%93%B0%EA%B8%B0-%EC%A0%84%EC%97%90-%EC%95%8C%EC%95%84%EB%91%98-%EA%B2%83">쓰기 전에 알아둘 것</h2>
<ul>
<li><strong>반드시 프로젝트 폴더 안에서 실행</strong> — 클로드 코드는 &quot;열려 있는 폴더&quot; 기준으로 일함. 바탕화면에서 실행하면 바탕화면 전체가 프로젝트가 됨 (실수 1위)</li>
<li><strong>스크린샷 한 장이 설명 열 줄보다 낫다</strong> — <code>Win+Shift+S</code>로 캡처, 클로드 코드 창에 <code>Ctrl+V</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="62" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%ED%97%88%EB%9D%BD%EC%9D%84-%EB%AC%BC%EC%96%B4%EB%B3%B4%EB%A9%B4-%EC%9D%B4%EB%A0%87%EA%B2%8C-%EB%8B%B5%ED%95%9C%EB%8B%A4">허락을 물어보면 이렇게 답한다</h2>

<th>언제</th>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="63" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="64" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%8A%AC%EB%9E%98%EC%8B%9C-%EB%AA%85%EB%A0%B9%EC%96%B4--%EB%8D%94-%EC%95%8C%EC%95%84%EB%91%90%EB%A9%B4-%EC%A2%8B%EC%9D%80-%EA%B2%83">슬래시(/) 명령어 — 더 알아두면 좋은 것</h2>

<tr>

</tr>
</thead>
<tbody>

<td>쓸 수 있는 명령어·사용법</td>
</tr>
<tr>

<td>AI 모델 고르기 (똑똑함↔속도)</td>
</tr>
<tr>

<td>이 대화의 사용량</td>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="65" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%ED%81%B4%EB%A1%9C%EB%93%9C-%EC%BD%94%EB%93%9C%EC%9D%98-4%EA%B0%80%EC%A7%80-%EC%8B%A4%ED%96%89-%EB%AA%A8%EB%93%9C">클로드 코드의 4가지 실행 모드</h2>
<p><code>Shift+Tab</code>을 누를 때마다 모드가 차례로 바뀝니다.</p>

<thead>
<tr>
<th>모드</th>

</tr>
</thead>
<tbody>
<tr>
<td><strong>플랜</strong></td>
<td>건드리지 않고 계획만 (읽기 전용)</td>

</tr>
<tr>
<td><strong>편집(수락)</strong></td>

</tr>

<td>익숙해졌을 때</td>
</tr>
<tr>

<blockquote>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> 바이패스(<code>--dangerously-skip-permissions</code>)는 파일 삭제까지 안 묻고 실행 — <strong>수업에서는 켜지 마세요.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="66" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%ED%94%8C%EB%9E%9C-%EB%AA%A8%EB%93%9C--%EB%90%98%EB%AC%BB%EA%B8%B0askuserquestion">플랜 모드 + 되묻기(AskUserQuestion)</h2>
<ul>
<li>큰 걸 시킬 땐 바로 만들게 말고 플랜 모드로 계획부터 → 승인해야 시작하니 되돌리기가 확 준다</li>
<li>&quot;애매하면 되물어봐&quot;를 붙이면 Claude가 넘겨짚는 대신 선택지를 물음 — 긴 프롬프트 없이 방향이 좁혀짐</li>
</ul>
<p><strong>EXAMPLE PROMPT (플랜 모드 + 되묻기)</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>동네 카페 소개 페이지를 만들 거야. 바로 만들지 말고 먼저 계획을 세워서 보여줘.
정하기 애매한 부분(색감, 페이지 구성, 담을 내용)은 나에게 선택지로 되물어봐.
내가 계획에 OK 하면 그때 만들기 시작해줘.
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="67" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%ED%81%B4%EB%A1%9C%EB%93%9C-%EC%BD%94%EB%93%9C%EB%8A%94-%EC%A7%80%EC%B9%A8%EC%84%9C%EB%B6%80%ED%84%B0-%EC%9D%BD%EA%B3%A0-%EC%8B%9C%EC%9E%91%ED%95%9C%EB%8B%A4">클로드 코드는 '지침서'부터 읽고 시작한다</h2>
<ul>
<li>일을 시작할 때 프로젝트 폴더의 규칙 문서(<code>CLAUDE.md</code>)를 먼저 읽고, 그 맥락 위에서 요청을 처리</li>
<li>&quot;한국어로 답해줘&quot; 같은 반복 지시를 안 해도 되고, <code>/clear</code> 해도 규칙은 유지 (새 대화마다 다시 읽음)</li>
<li>잘 쓰는 법은 Day 2 'CLAUDE.md와 Skill'에서 — 여기선 &quot;규칙 문서를 먼저 읽는다&quot;는 원리만</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="68" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%8B%A4%EC%8A%B5--%EC%B2%AB-%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8">실습 — 첫 프롬프트</h2>
<ol>
<li>바탕화면에 <code>vibe-day1</code> 폴더 만들기 — 이 폴더가 &quot;프로젝트&quot; (바탕화면 자체가 아니라 그 안 폴더)</li>

<h2 id="%EC%A0%80%EC%9E%A5%EC%9D%80-%EC%96%B4%EB%96%BB%EA%B2%8C--%EC%99%95%EB%B3%B5-4%EB%8B%A8%EA%B3%84">&quot;저장&quot;은 어떻게 — 왕복 4단계</h2>
<ul>
<li>&quot;주문하기&quot; 누르면: ① 화면이 서버에 요청 → ② 서버가 DB에 기록 → ③ DB가 결과 반환 → ④ 서버가 화면에 &quot;완료&quot;</li>
<li>서버·DB 없이 화면에만 저장하면? 새로고침하면 지워지는 칠판</li>
<li>구조를 알면 &quot;저장 안 돼, 고쳐줘&quot; 대신 &quot;데이터가 저장되게 바꿔줘&quot;라고 짚어 말할 수 있다</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="78" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%BD%94%EB%93%9C%EB%A5%BC-%EC%9D%BD%EB%8A%94-%EB%88%88--%EB%94%B1-4%EB%8B%A8%EC%96%B4">코드를 읽는 눈 — 딱 4단어</h2>
<p>목표는 코드를 쓰는 게 아니라 Claude의 계획·보고를 <strong>알아듣는 것</strong>.</p>
<table>
<thead>
<tr>
<th>단어</th>
<th>쉬운 뜻</th>
<th>예</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>변수</strong></td>
<td>값에 붙인 이름표</td>
<td><code>price = 3000</code></td>
</tr>
<tr>
<td><strong>조건문</strong></td>
<td>&quot;만약 ~라면&quot;</td>
<td>100점이면 &quot;축하&quot; (if)</td>
</tr>
<tr>
<td><strong>반복문</strong></td>
<td>&quot;각각에 대해&quot;</td>
<td>상품 100개 하나씩 그리기 (for)</td>
</tr>
<tr>
<td><strong>함수</strong></td>
<td>이름 붙인 작업 묶음</td>
<td>&quot;점수계산()&quot;</td>
</tr>
</tbody>
</table>
<ul>
<li>읽는 눈이 생기면 지시가 달라진다 — &quot;조건문 기준 금액을 5만 원으로 바꿔줘&quot;</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="79" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">

<h2 id="%EC%8B%A4%EC%8A%B5--%EB%82%B4-%ED%8E%98%EC%9D%B4%EC%A7%80-%ED%95%B4%EB%B6%80%ED%95%98%EA%B8%B0">실습 — 내 페이지 해부하기</h2>

<li>브라우저 <code>F12</code>(노트북 <code>Fn+F12</code>) → Elements 탭에서 내 문장 찾기 = HTML, 오른쪽 Styles = CSS</li>
<li>&quot;이 페이지에서 프론트엔드는 어디까지야? 백엔드가 필요한 기능 3개 제안해줘&quot;</li>
<li>&quot;변수·조건문·함수를 하나씩 찾아 비개발자에게 설명하듯 한글로 번역해줘&quot;</li>
<li>&quot;그런 코드가 없다&quot;고 하면 → &quot;간단한 예시를 하나 추가해서 보여줘&quot;</li>
</ol>
</section>

<h2 id="%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8-%EC%97%94%EC%A7%80%EB%8B%88%EC%96%B4%EB%A7%81--%ED%86%A0%ED%81%B0-%EC%A0%88%EC%95%BD%EB%B2%95">프롬프트 엔지니어링 + 토큰 절약법</h2>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="82" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%A2%8B%EC%9D%80-%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8%EC%9D%98-4%EC%9A%94%EC%86%8C--ptcf">좋은 프롬프트의 4요소 — PTCF</h2>
<table>
<thead>
<tr>
<th>요소</th>
<th>스스로 묻는 질문</th>
<th>예시</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>P 역할</strong></td>
<td>누구로서?</td>
<td>&quot;너는 소개 페이지 잘 만드는 웹 디자이너야&quot;</td>
</tr>
<tr>
<td><strong>T 할 일</strong></td>
<td>무엇을?</td>
<td>&quot;한 장짜리 소개 페이지 만들어줘&quot;</td>
</tr>
<tr>
<td><strong>C 맥락</strong></td>
<td>대상·목적·조건?</td>
<td>&quot;채용 담당자 / 갈색·크림색만 / 한 화면&quot;</td>
</tr>
<tr>
<td><strong>F 형식</strong></td>
<td>어떤 산출물로?</td>
<td>&quot;index.html 한 파일, 브라우저로 열어줘&quot;</td>
</tr>
</tbody>
</table>
<ul>
<li><strong>'목표'와 '제약'은 모두 C(맥락)에</strong> 담습니다 — 이 둘이 결과를 가장 크게 바꿉니다</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="83" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="83" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%99%9C-%EA%B5%AC%EC%B2%B4%EC%A0%81%EC%9D%B4%EC%96%B4%EC%95%BC-%ED%95%98%EB%82%98--%ED%86%A0%ED%81%B0-%EC%A0%88%EC%95%BD">왜 구체적이어야 하나 + 토큰 절약</h2>
<ul>
<li>AI는 마음을 못 읽는다 — 안 말한 부분은 <strong>세상의 평균으로 채운다</strong></li>
<li>큰 것을 시킬 땐 첫 줄에 &quot;단계적으로 개발할 예정&quot; 선언 후 지금 할 일 하나만</li>
<li>첫 결과가 아쉬운 건 정상 — 다시 시키지 말고 아쉬운 부분만 짚기</li>
<li><strong>토큰 절약 3가지</strong> — ① 주제 바뀌면 <code>/clear</code> ② 관련 파일만 ③ 한 번에 하나씩</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="84" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%99%B8%EC%9B%8C%EB%91%98-%EB%A7%8C%EB%8A%A5-%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8-6%EA%B0%9C">외워둘 만능 프롬프트 6개</h2>
<table>
<thead>
<tr>
<th>상황</th>
<th>이렇게 말한다</th>
</tr>
</thead>
<tbody>
<tr>
<td>에러가 났을 때</td>
<td>&quot;에러 나는데 고쳐줘&quot; + [스크린샷]</td>
</tr>
<tr>
<td>방금 게 마음에 안 들 때</td>
<td>&quot;방금 한 거 되돌려줘&quot; (같은 대화 안)</td>
</tr>
<tr>
<td>새 대화 시작 직후</td>
<td>&quot;이 프로젝트 구조랑 현재 상태 정리해줘&quot;</td>
</tr>
<tr>
<td>다음 작업 넘어가기 전</td>
<td>&quot;페이지 전체 점검해줘, 깨진 거 없는지&quot;</td>
</tr>
<tr>
<td>대화가 길어져 느릴 때</td>
<td><code>/compact</code></td>
</tr>
<tr>
<td>큰 걸 시작할 때</td>
<td>&quot;단계적으로 개발할 예정. 지금은 ○○만&quot;</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="85" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%8B%A4%EC%8A%B5--%EB%82%98%EC%81%9C-vs-%EC%A2%8B%EC%9D%80-%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8">실습 — 나쁜 vs 좋은 프롬프트</h2>
<ol>
<li>1차: &quot;자기소개 페이지 예쁘게 만들어줘&quot;</li>
<li>2차: 아래 PTCF를 갖춘 프롬프트로 다시</li>
<li>두 결과를 나란히 놓고 비교 — 어떤 요소가 가장 크게 바꿨나</li>
</ol>
<p><strong>EXAMPLE PROMPT (2차)</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>너는 카페 소개 페이지를 잘 만드는 웹 디자이너야. [P 역할]
따뜻한 동네 카페를 알리는 소개 페이지를 만들어줘. [T 할 일]
3초 안에 &quot;따뜻한 동네 카페&quot; 인상 / 스크롤 없이 한 화면 / 갈색·크림색만. [C 맥락]
index.html 한 파일, 상단 로고·중앙 한 줄 소개·하단 인스타 링크 버튼. [F 형식]
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="86" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="86" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8--%EB%8D%94-%EA%B9%8A%EC%9D%B4-%EC%B0%B8%EA%B3%A0-%EC%9E%90%EB%A3%8C">프롬프트 — 더 깊이 (참고 자료)</h2>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="87" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="87" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%B0%94%EC%9D%B4%EB%B8%8C%EC%BD%94%EB%94%A9-%ED%94%8C%EB%A1%9C%EC%9A%B0--%EA%B9%83git">바이브코딩 플로우 + 깃(Git)</h2>
<p><em>DAY 1 · 13:00–13:30 · 이론</em></p>
<blockquote>
<p>오후 프로젝트에서 그대로 밟을 3단계 플로우와, 결과물을 인터넷에 공개하는 수단(깃)을 배웁니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="88" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="88" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%AA%A8%EB%93%A0-%ED%94%84%EB%A1%9C%EC%A0%9D%ED%8A%B8%EA%B0%80-%EB%B0%9F%EB%8A%94-3%EB%8B%A8%EA%B3%84">모든 프로젝트가 밟는 3단계</h2>
<table>
<thead>
<tr>
<th>단계</th>
<th>하는 일</th>
<th>한 줄 요령</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>① 기획·디자인</strong></td>
<td>무엇을 왜 만들지</td>
<td>&quot;누가 보나/무엇을/어떤 분위기&quot; 세 가지</td>
</tr>
<tr>
<td><strong>② 구현·디버깅</strong></td>
<td>만들고 고친다</td>
<td>섹션 하나씩, 한 번에 하나만</td>
</tr>
<tr>
<td><strong>③ 배포</strong></td>
<td>인터넷에 공개</td>
<td>내 파일이 전 세계 URL이 된다</td>
</tr>
</tbody>
</table>
<blockquote>
<p>(도식: GitHub Pages 배포 흐름 도식)</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="89" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="89" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EA%B9%83git--%EA%B2%81%EB%A8%B9%EC%A7%80-%EC%95%8A%EC%95%84%EB%8F%84-%EB%90%98%EB%8A%94-%EC%9D%B4%EC%9C%A0">깃(Git) — 겁먹지 않아도 되는 이유</h2>
<ul>
<li>깃 = 코드의 <strong>세이브 포인트</strong>. &quot;여기까지 저장&quot;을 남기고, 망치면 되돌린다</li>
<li>왜 Ctrl+S로 부족한가 — ① 어제 상태로 못 돌아감 ② 컴퓨터 고장 나면 사라짐 ③ 배포하려면 코드가 클라우드에 있어야 함</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="90" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="90" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%9A%A9%EC%96%B4-4%EA%B0%9C--%ED%83%9D%EB%B0%B0%EB%A1%9C-%EA%B8%B0%EC%96%B5%ED%95%98%EA%B8%B0">용어 4개 — 택배로 기억하기</h2>
<table>
<thead>
<tr>
<th>용어</th>
<th>뜻</th>
<th>택배 비유</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>저장소</strong></td>
<td>프로젝트가 사는 방 (GitHub)</td>
<td>택배 상자</td>
</tr>
<tr>
<td><strong>커밋</strong></td>
<td>저장 지점 만들기</td>
<td>포장·송장</td>
</tr>
<tr>
<td><strong>푸시</strong></td>
<td>클라우드에 올리기</td>
<td>발송</td>
</tr>
<tr>
<td><strong>배포</strong></td>
<td>누구나 보게 공개</td>
<td>배달 완료</td>
</tr>
</tbody>
</table>
<ul>
<li>깃허브 = 코드계의 구글드라이브 / GitHub Pages = 올린 HTML을 공짜 웹사이트로 (오늘의 배포 수단)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="91" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="91" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EA%B9%83-vs-%EA%B9%83%ED%97%88%EB%B8%8C--%ED%97%B7%EA%B0%88%EB%A6%AC%EC%A7%80-%EC%95%8A%EA%B2%8C">깃 vs 깃허브 — 헷갈리지 않게</h2>
<table>
<thead>
<tr>
<th></th>
<th>깃(Git)</th>
<th>깃허브(GitHub)</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>정체</strong></td>
<td>내 컴퓨터의 세이브 관리 도구</td>
<td>인터넷에 백업·공유하는 저장소</td>
</tr>
<tr>
<td><strong>어디에</strong></td>
<td>내 컴퓨터 안</td>
<td>인터넷</td>
</tr>
<tr>
<td><strong>게임 비유</strong></td>
<td>게임의 저장 기능</td>
<td>클라우드 세이브</td>
</tr>
<tr>
<td><strong>없으면</strong></td>
<td>되돌리기 안 됨</td>
<td>고장 나면 코드 사라짐</td>
</tr>
</tbody>
</table>
<ul>
<li>깃으로 세이브(커밋) → 깃허브로 올린다(푸시). 이 두 단계가 한 세트</li>
</ul>
</section>

<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%A7%84%ED%96%89-%EC%88%9C%EC%84%9C">진행 순서</h2>
<table>
<thead>
<tr>
<th>단계</th>
<th>시간</th>
<th>하는 일</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>① 기획</strong></td>
<td>15분</td>
<td>구성부터 Claude와 함께 정한다</td>
</tr>
<tr>
<td><strong>② 구현</strong></td>
<td>40분</td>
<td>섹션 하나씩 요청 (전부보다 &quot;소개 섹션만&quot;)</td>
</tr>
<tr>
<td><strong>③ 다듬기</strong></td>
<td>15분</td>
<td>구체적으로 — &quot;줄 간격을 넓혀줘&quot;</td>
</tr>
<tr>
<td><strong>④ 배포</strong></td>
<td>20분</td>
<td>배포 순서를 그대로 따라간다</td>
</tr>
</tbody>
</table>
<p><strong>EXAMPLE PROMPT (기획)</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>나를 소개하는 프로필 페이지를 만들고 싶어. 만들기 전에 먼저,
어떤 섹션(소개, 경력, 취미, 연락처 등)으로 구성하면 좋을지 목록으로 제안해줘.
분위기는 &quot;차분하고 신뢰감 있게&quot;.
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="98" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="98" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="example-prompt-%EA%B5%AC%ED%98%84--%EB%B9%88%EC%B9%B8%EB%A7%8C-%EC%B1%84%EC%9A%B0%EA%B8%B0">EXAMPLE PROMPT (구현 — 빈칸만 채우기)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>P(역할): 너는 개인 소개 페이지를 잘 만드는 웹 디자이너야.
T(할 일): [내 이름]을 소개하는 한 장짜리 페이지를 만들어줘.
C(맥락):
- 보는 사람: [친구/채용 담당자/잠재 고객]
- 목적: [나를 알리기/포트폴리오/연락 받기]
- 구성: 큰 제목 + 한 줄 소개 → 특징 3가지 → 연락 방법
- 분위기: [차분한/밝은/전문적인] 톤, 포인트 색은 [좋아하는 색]
F(형식):
- index.html 파일 하나로 (HTML+CSS+JS만)
- 휴대폰에서도 안 깨지게
- 완성되면 브라우저에서 바로 열어줘
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="99" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="99" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%B0%B0%ED%8F%AC-%EC%88%9C%EC%84%9C--github-pages-%ED%81%B4%EB%A6%AD%EB%A7%8C%EC%9C%BC%EB%A1%9C">배포 순서 — GitHub Pages (클릭만으로)</h2>
<ol>
<li>확인 2가지 — 저장소는 <strong>Public</strong>, 첫 화면 파일명은 정확히 <strong><code>index.html</code></strong></li>
<li>github.com → + → New repository → 이름(영문 소문자) → Create</li>
<li>uploading an existing file → 폴더 안 파일 전부 드래그 → Commit changes</li>
<li>Settings → Pages → Source: Deploy from a branch, Branch: main + / (root) → Save</li>
<li>새로고침하면 &quot;Your site is live at…&quot; — 주소는 <code>https://아이디.github.io/저장소이름/</code></li>
<li>내 폰으로도 열어보기 — 진짜 인터넷에 있다는 뜻</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="100" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="100" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%ED%94%84%EB%A1%9C%ED%95%84--%EC%9D%B4-%EC%9E%A5%EC%9D%84-%EB%A7%88%EC%B9%98%EB%A9%B4">프로필 — 이 장을 마치면</h2>
<ul>
<li>[ ] 내 프로필 페이지가 <code>https://아이디.github.io/…</code>로 열린다</li>
<li>[ ] 폰으로도 열어봤다</li>
<li>[ ] 옆 사람과 URL을 주고받아 구경했다</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 수정은 쉽습니다 — 저장소에서 Add file → Upload files로 <strong>같은 이름 파일을 다시 올리면 덮어쓰기</strong>되고 1~2분 뒤 반영. 첫 배포만 최대 10분.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="101" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="101" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%ED%94%84%EB%A1%9C%ED%95%84--%EC%9E%98-%EC%95%88-%EB%90%A0-%EB%95%8C">프로필 — 잘 안 될 때</h2>
<table>
<thead>
<tr>
<th>증상</th>
<th>해결</th>
</tr>
</thead>
<tbody>
<tr>
<td>404 페이지</td>
<td>첫 화면 파일명이 <code>index.html</code>이 아님 → &quot;index.html로 바꿔줘&quot;</td>
</tr>
<tr>
<td>고쳤는데 그대로</td>
<td>몇 분 뒤 <strong>Ctrl+F5</strong> 강력 새로고침</td>
</tr>
<tr>
<td>Pages 메뉴 안 켜짐</td>
<td>저장소가 Private → Public으로 변경</td>
</tr>
<tr>
<td>모양이 깨짐</td>
<td>&quot;CSS 파일 경로 맞는지 확인해줘, 대소문자까지&quot;</td>
</tr>
</tbody>
</table>
<p><strong>참고 자료</strong> — GitHub Pages 퀵스타트 / Pages 사이트 만들기 단계별 안내</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="102" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="102" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">

<p>목표는 완성이 아니라 <strong>버그를 만나고 고치는 경험</strong>입니다.</p>

<h2 id="%EC%97%90%EB%9F%AC%EB%A5%BC-%EB%A7%8C%EB%82%98%EB%A9%B4--f12-%E2%86%92-console-%E2%86%92-%EC%BA%A1%EC%B2%98">에러를 만나면 — F12 → Console → 캡처</h2>

<li>브라우저 <code>F12</code> → Console 탭 → 빨간 글씨. 개발자도구 마스터할 필요 없다</li>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="104" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="104" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">

<h2 id="%EB%94%94%EB%B2%84%EA%B9%85-3%EC%9B%90%EC%B9%99--3%EC%9D%BC-%EB%82%B4%EB%82%B4-%EC%93%B4%EB%8B%A4">디버깅 3원칙 — 3일 내내 쓴다</h2>
<table>
<thead>
<tr>
<th>원칙</th>
<th>이렇게</th>
<th>왜</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>① 에러는 그대로</strong></td>

<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EA%B5%AC%EC%B2%B4%EC%A0%81%EC%9D%BC%EC%88%98%EB%A1%9D-%EA%B2%B0%EA%B3%BC%EA%B0%80-%EC%A2%8B%EC%95%84%EC%A7%84%EB%8B%A4--%EC%82%AC%EA%B3%BC%EA%B2%8C%EC%9E%84">구체적일수록 결과가 좋아진다 — 사과게임</h2>
<blockquote>
<p>이번 실습은 <strong>사과게임</strong>으로 &quot;구체적으로 지시하는 연습&quot;. 완성이 목적이 아니라 규칙을 또박또박 설명할수록 결과가 어떻게 달라지는지 느끼는 것.</p>
</blockquote>
<ul>
<li>그냥 &quot;게임 만들어줘&quot;면 AI가 빈칸을 마음대로 채운다 — 상상과 전혀 다른 게 나옴</li>
<li>규칙·화면·조작법을 풀어주면 내 머릿속에 훨씬 가깝게 만든다 — 바이브코딩의 가장 중요한 기술</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="106" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="106" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%82%AC%EA%B3%BC%EA%B2%8C%EC%9E%84%EC%9D%B4%EB%9E%80">사과게임이란</h2>
<ul>
<li>화면에 1~9 숫자가 적힌 사과들이 직사각형 격자로 빽빽하게 놓여 있다</li>
<li>마우스로 드래그해 사각형 범위를 지정, 그 안의 사과를 한꺼번에 선택</li>
<li>선택한 숫자의 합이 정확히 10이면 사라지고 점수↑ (10 아니면 아무 일 없음)</li>
<li>제한 시간(예: 2분) 안에 최대한 많이 없애기</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>먼저 진짜 게임을 3분만 해보세요</strong> (gamesaien.com 사과게임). 직접 해본 게임은 규칙 설명이 훨씬 쉽습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="107" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="107" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%8B%A4%EC%8A%B5--%EC%82%AC%EA%B3%BC%EA%B2%8C%EC%9E%84-%EB%A7%8C%EB%93%A4%EA%B8%B0">실습 — 사과게임 만들기</h2>
<ol>
<li>먼저 진짜 사과게임을 해보며 규칙 익히기</li>
<li>&quot;만들어줘&quot;가 아니라 &quot;계획부터 세워줘&quot; — 계획을 읽으면 빠진 부분이 보임</li>
<li>계획이 좋으면 &quot;이 계획대로 만들어줘&quot;</li>
<li>완성되면 진짜 게임과 나란히 켜고 다른 점을 하나씩 개선</li>
<li>버그는 버그 신고 템플릿으로</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="108" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="108" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="example-prompt-%EA%B3%84%ED%9A%8D%EB%B6%80%ED%84%B0--plan-first">EXAMPLE PROMPT (계획부터 — plan-first)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>사과 게임을 만들 계획을 세워보자. https://www.gamesaien.com/game/fruit_box_a 와 같은 게임이야.

규칙:
- 화면에 1~9 숫자 사과들이 직사각형 격자로 빽빽하게 놓여 있어.
- 마우스로 드래그해 사각형 범위를 지정하면 그 안의 사과들이 선택돼.
- 선택한 숫자의 합이 정확히 10이면 사라지고 점수가 올라가. 10이 아니면 아무 일도 없어.
- 제한 시간 2분 안에 최대한 많이 없애는 게 목표야.

사과는 별도 이미지 없이 원 배경 위에 1~9 숫자를 그려서 표현해줘.
완성되면 index.html 파일 하나로, 더블클릭해 브라우저로 바로 열 수 있게.
일단 코드부터 짜지 말고, 계획부터 세워줘.
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="109" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="109" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%99%9C-%EA%B3%84%ED%9A%8D%EB%B6%80%ED%84%B0%EC%9D%BC%EA%B9%8C">왜 &quot;계획부터&quot;일까</h2>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 바로 만들게 하면 잘못된 방향으로 한참 가버립니다. 계획을 먼저 읽어보면 <strong>빠진 규칙</strong>(예: 시간이 끝나면 어떻게 되는지)이 보이고, 코드 나오기 전에 바로잡을 수 있습니다.</p>
</blockquote>
<p><strong>EXAMPLE PROMPT (최종 산출물 형태)</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>완성되면 index.html 파일 하나로 만들어줘.
따로 서버를 켜지 않아도, 그 파일을 더블클릭하면 브라우저에서 바로 열려서 플레이할 수 있게 해줘.
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="110" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="110" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="example-prompt-%EB%B2%84%EA%B7%B8-%EC%8B%A0%EA%B3%A0-%ED%85%9C%ED%94%8C%EB%A6%BF">EXAMPLE PROMPT (버그 신고 템플릿)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>버그가 있어.
기대한 것: 합이 10인 사과를 드래그하면 사라져야 해.
실제 동작: 드래그해도 아무 반응이 없어.
에러 메시지: (F12 콘솔에 뜬 빨간 글씨를 그대로 붙여넣기)
이것만 고쳐줘. 다른 부분은 건드리지 마.
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="111" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="111" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%A7%84%EC%A7%9C-%EA%B2%8C%EC%9E%84%EA%B3%BC-%EB%B9%84%EA%B5%90%ED%95%98%EB%A9%B0-%EB%8B%A4%EB%93%AC%EA%B8%B0">진짜 게임과 비교하며 다듬기</h2>
<p>창 두 개로 나란히 켜고 **&quot;진짜는 이런데 내 건 이래&quot;**를 <strong>하나씩</strong> 짚습니다. 한 번에 하나가 핵심.</p>
<p><strong>세부 튜닝 예시</strong></p>
<ol>
<li>드래그하는 동안 선택 영역이 안 보임 → 미리보기 추가</li>
<li>사과가 너무 적거나 큼 → 개수·크기 조정</li>
<li>사라진 자리에 새 사과가 채워짐 → 원래 규칙대로 안 채우게</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="112" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="112" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="example-prompt-%EB%93%9C%EB%9E%98%EA%B7%B8-%EC%98%81%EC%97%AD-%EB%AF%B8%EB%A6%AC%EB%B3%B4%EA%B8%B0--%EA%B0%9C%EC%88%98%ED%81%AC%EA%B8%B0">EXAMPLE PROMPT (드래그 영역 미리보기 / 개수·크기)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>지금은 마우스로 드래그해도 어디를 고르는지 안 보여.
진짜 사과게임처럼, 드래그하는 동안 선택 중인 사각형 영역이 반투명한 박스로 보이게 해줘.
이 부분만 고치고 다른 건 건드리지 마.
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>지금 사과가 너무 크고 개수가 적어서 싱거워.
진짜 게임처럼 가로 17칸, 세로 10칸 정도로 촘촘하게 배치하고, 크기도 그에 맞게 줄여줘.
이 부분만 고쳐줘.
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="113" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="113" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="example-prompt-%EC%82%AC%EB%9D%BC%EC%A7%84-%EC%9E%90%EB%A6%AC-%EC%95%88-%EC%B1%84%EC%9A%B0%EA%B8%B0--%EB%93%9C%EB%9E%98%EA%B7%B8-%EB%8B%A4%EB%93%AC%EA%B8%B0">EXAMPLE PROMPT (사라진 자리 안 채우기 + 드래그 다듬기)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>두 가지만 고쳐줘.
1) 합이 10이 되어 사과가 사라진 자리에 새 사과가 다시 채워지고 있어. 원래 규칙대로 빈칸으로 둬.
2) 드래그가 어색해 — 살짝만 움직여도 뚝뚝 끊겨. 부드럽게 이어지도록 다듬어줘.
한 번에 하나씩 확인할 거니까, 1번부터 고쳐주고 결과를 알려줘.
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="114" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="114" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EA%B0%9C%EB%B0%9C%EC%9E%90-%EB%8F%84%EA%B5%AC-%EC%95%84%EC%A3%BC-%EC%82%B4%EC%A7%9D">개발자 도구 아주 살짝</h2>
<ul>
<li>브라우저 <code>F12</code> → 개발자 도구. 마스터할 필요 없고 딱 하나만</li>
<li>왼쪽 위 <strong>요소 선택기(화살표)</strong> 누른 뒤 화면 특정 부분 클릭 → 어떤 요소인지 정보 표시</li>
<li>&quot;이 부분이 이상해&quot;라고 할 때 요소 선택기로 짚거나 <code>Win+Shift+S</code>로 캡처해 붙이면 훨씬 정확</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> [캡처: 크롬 개발자 도구(F12) — 요소 선택기로 사과 하나 클릭한 화면]</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="115" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="115" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EA%B3%A0%EC%A0%84%EA%B2%8C%EC%9E%84--%EC%9D%B4-%EC%9E%A5%EC%9D%84-%EB%A7%88%EC%B9%98%EB%A9%B4">고전게임 — 이 장을 마치면</h2>
<ul>
<li>[ ] 내 게임이 실제로 플레이된다 (완성도는 아직 중요하지 않음)</li>
<li>[ ] 버그를 최소 한 번 만나 템플릿으로 신고해 고쳐봤다</li>
<li>[ ] &quot;기대한 것 vs 실제 동작&quot;으로 말하는 요령이 입에 붙기 시작</li>
</ul>

<h3 id="ai%EC%97%90%EA%B2%8C-%EA%B7%9C%EC%B9%99%EC%9D%84-%EA%B8%B0%EC%96%B5%EC%8B%9C%ED%82%A4%EA%B8%B0">AI에게 규칙을 기억시키기</h3>
