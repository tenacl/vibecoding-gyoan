</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="124" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="124" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="claudemd--%EA%B8%B0%EC%96%B5%EC%9D%B4-%EB%A6%AC%EC%85%8B%EB%90%98%EB%8A%94-%EB%B9%84%EC%84%9C%EC%97%90%EA%B2%8C">CLAUDE.md — 기억이 리셋되는 비서에게</h2>
<ul>
<li>클로드 코드는 새 대화마다 기억이 리셋 — 책상 위 업무 지침서가 CLAUDE.md</li>
<li>프로젝트 폴더에 두면 자동으로 먼저 읽힘 — <code>/clear</code> 후에도 적용, 토큰 절약과도 궁합</li>
<li>위치 중요 — 반드시 프로젝트 맨 위(루트) 폴더. 하위 폴더면 못 찾음</li>
<li>쉬운 생성법 <code>/init</code> — 분석해 알아서 만들어줌, 그 위에 내 규칙을 보탬</li>
<li>작성 팁 — ① 간결하게 ② 구체적으로 ③ 처음부터 완벽 말고 점점 키움</li>
<li>업데이트 — 새 규칙 생겼을 때, AI가 같은 실수 반복할 때</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="125" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="125" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="skill--%EB%B0%98%EB%B3%B5-%EC%9E%91%EC%97%85%EC%9D%84-%EB%AA%85%EB%A0%B9%EC%96%B4-%ED%95%98%EB%82%98%EB%A1%9C">Skill — 반복 작업을 명령어 하나로</h2>
<ul>
<li>Skill = 자주 하는 절차를 등록해 <code>/이름</code> 한 줄로 실행 (엑셀 매크로와 비슷)</li>
<li>만드는 법도 말로 — &quot;○○하는 스킬을 만들어줘&quot;</li>
<li>좋은 대상 — ① 반복되고 ② 순서가 정해지고 ③ 자주 하는 작업. &quot;코드 잘 짜줘&quot; 같은 막연한 건 스킬이 아님</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="126" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="126" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%8B%A4%EC%8A%B5--%EC%98%A4%EB%8A%98-%EC%93%B8-claudemd-%EB%A7%8C%EB%93%A4%EA%B8%B0">실습 — 오늘 쓸 CLAUDE.md 만들기</h2>
<ol>
<li>바탕화면에 <code>vibe-day2</code> 폴더 새로 (어제 프로필 폴더 아님)</li>
<li>그 안에 <code>CLAUDE.md</code> 만들기 (Claude에게 시켜도 됨)</li>
<li>아래 예시 참고해 내 규칙 적기</li>
<li>새 대화 열어 아무 요청, 규칙이 자동 적용되는지 확인</li>

<p><strong>CLAUDE.md 예시</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code># 프로젝트 규칙
- 답변은 한국어로, 설명은 초보자 눈높이로

- 코드를 바꾸면 무엇을 왜 바꿨는지 한 줄로 알려주기
- API 키는 절대 코드에 직접 적지 않기
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="127" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="127" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="claudemd--%EC%9D%B4-%EC%9E%A5%EC%9D%84-%EB%A7%88%EC%B9%98%EB%A9%B4">CLAUDE.md — 이 장을 마치면</h2>

<blockquote>
<p>오늘 하루 종일 쓸 단 하나의 개념 — &quot;정해진 형식으로 요청하면, 데이터가 온다.&quot;</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="129" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="129" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="api--%ED%95%B5%EC%8B%AC-%EB%82%B4%EC%9A%A9">API — 핵심 내용</h2>
<ul>
<li>API = Application Programming Interface. &quot;응용 프로그램끼리 대화하는 접속 창구&quot;</li>
<li>흐름은 항상 같다 — 요청(&quot;서울 미세먼지 주세요&quot;) → 응답(&quot;여기 있습니다&quot;)</li>
<li>응답은 주로 <strong>JSON</strong> — 중괄호 <code>{ }</code>로 정리된 데이터 꾸러미 (읽는 건 AI가 해줌)</li>
<li><strong>API 키</strong> = &quot;요청할 자격이 있어요&quot; 증명하는 열쇠. 내 명의로 사용량 기록</li>
<li>무료 API — 공공데이터포털(data.go.kr), Google Cloud 콘솔</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="130" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="130" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%E2%9A%A0%EF%B8%8F-%ED%82%A4%EB%8A%94-%EB%B9%84%EB%B0%80%EB%B2%88%ED%98%B8%EB%8B%A4--%EC%98%A4%EB%8A%98-%EA%B0%80%EC%9E%A5-%EC%A4%91%EC%9A%94%ED%95%9C-%EC%95%88%EC%A0%84-%EC%88%98%EC%B9%99"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> 키는 비밀번호다 — 오늘 가장 중요한 안전 수칙</h2>
<ul>
<li>어제 깃허브 올리는 법을 배웠기에 오늘이 가장 위험 — 키가 적힌 코드를 올리면 요금 폭탄</li>
<li>안전 수칙 ① — &quot;API 키가 코드에 노출되지 않게 해줘&quot;라고 요청</li>
<li>안전 수칙 ② — 깃허브에 올리기 전, 키가 든 파일이 포함됐는지 반드시 확인</li>
<li>오늘 실습은 연습용 무료 키라 코드에 넣되 <strong>깃허브엔 안 올리는 게 규칙</strong>. 실제 서비스는 키를 서버에 숨김(백엔드가 필요한 이유)</li>
</ul>
<p><strong>참고 자료</strong> — 공공데이터포털(data.go.kr) / Google Cloud 콘솔</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="131" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="131" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%9E%9C%EB%8D%A4-%EC%9D%B4%EB%AF%B8%EC%A7%80-api-%EB%AF%B8%EC%88%A0%EA%B4%80">랜덤 이미지 API 미술관</h2>
<h3 id="%ED%82%A4-%EC%97%86%EC%9D%B4-%EC%B2%AB-%EC%84%B1%EA%B3%B5">키 없이 첫 성공</h3>
<p><em>DAY 2 · 10:40–11:00 · 완충 실습</em></p>
<blockquote>
<p><strong>키 발급도 가입도 없이</strong> API를 붙여 미술관 사이트를 완성, &quot;API로 데이터를 받아 화면에 뿌리는&quot; 감을 익힙니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="132" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="132" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%99%9C-%EC%9D%B4%EA%B1%B8-%EB%A8%BC%EC%A0%80-%ED%95%98%EB%82%98--%EC%99%84%EC%B6%A9warm-up">왜 이걸 먼저 하나 — 완충(warm-up)</h2>
<ul>
<li>곧 배울 구글·공공데이터 API는 가입·키 발급·신청이 많아 시작부터 막히기 쉬움 — 그 앞에서 지치면 재미있는 부분에 도달 전 힘 빠짐</li>
<li>키가 전혀 필요 없는 API로 &quot;성공&quot;을 먼저 맛보면 뒤 준비 단계가 만만해짐</li>
<li>핵심은 준비물이 아니라 흐름 — 주소로 요청 → 데이터 응답 → 화면에 뿌림</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="133" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="133" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="picsumphotos--%ED%82%A4%EA%B0%80-%ED%95%84%EC%9A%94-%EC%97%86%EB%8A%94-api">picsum.photos — 키가 필요 없는 API</h2>
<ul>
<li>주소 하나만 부르면 랜덤 사진을 돌려주는 무료 이미지 API. 가입도 키도 없음 — 주소가 곧 요청</li>
<li><code>https://picsum.photos/300</code> → 가로·세로 300px 랜덤 이미지. 끝 숫자가 크기, 부를 때마다 다른 사진</li>
<li>브라우저 주소창에 직접 쳐 보세요 — 새 사진이 뜨면 그게 API가 응답하는 순간</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 주소 뒤에 붙여 보기 — <code>/300/200</code>(가로·세로), <code>/300?grayscale</code>(흑백), <code>/300?blur</code>(흐리게). 요청을 조금씩 바꿔 보는 습관이 내일 진짜 API에도 그대로.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="134" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="134" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%8B%A4%EC%8A%B5--%EA%B0%80%EC%83%81-%EB%AF%B8%EC%88%A0%EA%B4%80-%EC%82%AC%EC%9D%B4%ED%8A%B8">실습 — 가상 미술관 사이트</h2>
<ol>
<li>새 폴더에 아래 계획 먼저 프롬프트로 뼈대 생성</li>
<li>계획을 읽고 &quot;좋아, 그대로 만들어줘&quot; (마음에 안 들면 여기서 고침)</li>
<li>브라우저로 열기 — 랜덤 사진 30장이 격자로 뜨면 1차 성공 (새로고침마다 바뀜)</li>
<li>개선 프롬프트로 전시회 디테일 얹기</li>
</ol>
<p><strong>EXAMPLE PROMPT (계획 먼저 — 미술관 뼈대)</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>https://picsum.photos/300 처럼 요청하면 300×300 랜덤 이미지를 돌려주는 무료 API가 있어. 키나 가입은 필요 없어.
이걸 이용해 가상 사진 전시회(온라인 미술관)처럼 보이는 웹사이트를 만들어줘.
이미지는 30장 정도를 격자(그리드)로 보기 좋게 배치하면 돼.
바로 코드부터 짜지 말고, 어떻게 만들지 계획부터 세워서 보여줘.
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="135" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="135" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="example-prompt-%EB%AF%B8%EC%88%A0%EA%B4%80-%EA%B0%9C%EC%84%A0-%E2%91%A0%E2%91%A1">EXAMPLE PROMPT (미술관 개선 ①②)</h2>
<p><strong>① 작품처럼 꾸미기</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>좋아. 이제 각 사진을 액자에 넣은 작품처럼 보이게 해줘.
사진마다 아래에 작품 제목과 작가 이름을 그럴싸하게 붙이고(예: &quot;무제 No.12 — 김바로&quot;),
페이지 맨 위에 미술관 이름과 한 줄 소개도 넣어줘.
</code></pre>
<p><strong>② 움직임 넣기</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>마우스를 사진 위에 올리면 살짝 커지면서 제목이 도드라지게 해줘.
사진을 클릭하면 큰 화면으로 확대돼 감상할 수 있으면 더 좋아.
</code></pre>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> [캡처: picsum 미술관 사이트 — 랜덤 사진 30장 격자, 제목·작가명]</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="136" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="136" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%AF%B8%EC%88%A0%EA%B4%80--%EC%9E%98-%EC%95%88-%EB%90%A0-%EB%95%8C">미술관 — 잘 안 될 때</h2>
<table>
<thead>
<tr>
<th>증상</th>
<th>해결</th>
</tr>
</thead>
<tbody>
<tr>
<td>빈 네모(깨진 이미지)만</td>
<td>인터넷 확인·새로고침 → &quot;주소가 <code>https://picsum.photos/300</code> 형식 맞는지 확인해줘&quot;</td>
</tr>
<tr>
<td>30장이 전부 같은 사진</td>
<td>&quot;사진마다 다르게 나오게 해줘&quot; (주소를 조금씩 다르게)</td>
</tr>
<tr>
<td>세로 한 줄로만 쌓임</td>
<td>&quot;사진을 여러 열의 격자로 정렬해줘&quot;</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="137" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="137" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%AF%B8%EC%88%A0%EA%B4%80--%EC%9D%B4-%EC%9E%A5%EC%9D%84-%EB%A7%88%EC%B9%98%EB%A9%B4">미술관 — 이 장을 마치면</h2>
<ul>
<li>[ ] 키도 가입도 없이 API로 받아온 사진 30장이 격자로 놓인 미술관이 브라우저에 떠 있다</li>
<li>[ ] &quot;주소로 요청하면 데이터가 오고 화면에 뿌린다&quot;는 API 한 바퀴를 직접 겪었다</li>
<li>[ ] 다음 세션부터 키가 필요한 진짜 API로 넘어갈 준비가 됐다</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="138" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="138" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%ED%94%84%EB%A1%9C%EC%A0%9D%ED%8A%B8-3--%EA%B5%AC%EA%B8%80-api-%ED%81%AC%EB%A1%AC-%EC%9D%B5%EC%8A%A4%ED%85%90%EC%85%98">프로젝트 3 · 구글 API 크롬 익스텐션</h2>
<p><em>DAY 2 · 11:00–12:00 · 프로젝트 3</em></p>
<blockquote>
<p>웹페이지가 아니라, <strong>크롬에 실제로 설치해서 쓰는 프로그램</strong>을 만듭니다.</p>
</blockquote>
<blockquote>
<p>(도식: 크롬 익스텐션 구조 — 파일 3개짜리 폴더가 곧 익스텐션. 셋 다 Claude가 만듦)</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="139" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="139" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%ED%81%AC%EB%A1%AC-%EC%9D%B5%EC%8A%A4%ED%85%90%EC%85%98--%ED%95%B5%EC%8B%AC-%EB%82%B4%EC%9A%A9">크롬 익스텐션 — 핵심 내용</h2>
<ul>
<li>크롬 익스텐션 = 크롬에 설치하는 작은 프로그램 (광고 차단기·번역기가 전부 익스텐션)</li>
<li>예시 — YouTube Data API로 &quot;채널명 넣으면 구독자·최근 영상&quot;, Google Maps API로 &quot;동네 즐겨찾기 지도&quot;</li>
<li>스토어 등록 없이 내 크롬엔 즉시 설치 — &quot;개발자 모드 로드&quot;</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="140" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="140" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%8B%A4%EC%8A%B5-%EC%88%9C%EC%84%9C">실습 순서</h2>
<ol>
<li>새 폴더 만들고 아래 프롬프트로 익스텐션 생성</li>
<li>크롬 주소창 <code>chrome://extensions</code> → 우상단 개발자 모드 켜기</li>
<li>&quot;압축해제된 확장 프로그램을 로드합니다&quot; → 내 폴더 (manifest.json이 바로 보이는 폴더)</li>
<li>우상단 퍼즐 아이콘에서 내 익스텐션 클릭 — 실행!</li>
<li>구글 API 실제 데이터가 팝업에 뜨면 완성</li>
</ol>
<p><strong>EXAMPLE PROMPT</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>크롬 익스텐션을 만들어줘. 아이콘을 누르면 작은 팝업이 뜨고,
유튜브 채널 이름을 검색하면 YouTube Data API로
구독자 수와 최근 영상 목록을 보여주는 기능이야.
API 키는 발급받아 뒀어. 키를 넣을 위치만 알려주면 내가 직접 넣을게.
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="141" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="141" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%9D%B5%EC%8A%A4%ED%85%90%EC%85%98--%EC%9E%98-%EC%95%88-%EB%90%A0-%EB%95%8C">익스텐션 — 잘 안 될 때</h2>
<table>
<thead>
<tr>
<th>증상</th>
<th>해결</th>
</tr>
</thead>
<tbody>
<tr>
<td>빨간 &quot;오류&quot; 버튼</td>

</tr>
</tbody>
</table>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="144" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="144" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">

<p><strong>EXAMPLE PROMPT (시작)</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>공공데이터포털의 미세먼지 API를 쓰는 웹페이지를 만들자.

인증키는 발급받아 뒀어. 넣을 위치를 알려줘.
</code></pre>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 막히면 디버깅 3원칙 — ① 에러 전문 ② 기대 vs 실제 ③ 한 번에 하나</p>

<tr>
<th>증상</th>
<th>해결</th>
</tr>
</thead>
<tbody>
<tr>

<td>일반 키와 <strong>인코딩 키 2가지</strong> — &quot;인코딩 키로 바꿔서 다시 호출해줘&quot;</td>
</tr>
<tr>
<td>콘솔에 <strong>CORS</strong> 빨간 에러</td>
<td>브라우저가 외부 요청 막은 것(내 잘못 아님) — &quot;CORS 우회 방법 적용해줘&quot;</td>
</tr>
<tr>

</tr>
</tbody>
</table>
<p><strong>이 장을 마치면</strong> — [ ] 콘솔에서 JSON 봤다 [ ] 데이터가 차트로 [ ] 질문→데이터 근거 답변</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="146" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="146" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">

<h2 id="%EA%B2%B0%EC%A0%9C--%ED%95%B5%EC%8B%AC-%EB%82%B4%EC%9A%A9">결제 — 핵심 내용</h2>
<ul>
<li>테스트 결제 = 결제 회사(토스페이먼츠)의 연습용 가짜 결제. 키가 <code>test_</code>면 실제 돈은 0원</li>
<li>키 두 종류 — <strong>클라이언트 키</strong>(<code>test_ck_</code>, 결제창 띄우기, 노출 OK) / <strong>시크릿 키</strong>(<code>test_sk_</code>, 결제 확정, 공개 금지)</li>
<li>내 키는 developers.tosspayments.com → 내 개발정보에 테스트 키 2개</li>
<li>흐름 — 스타터 → 상품 목록 → 장바구니 → 결제 버튼 → 토스 결제창 → 성공 화면</li>
<li>주문 내역은 저장(DB), &quot;진짜 결제됐는지&quot;는 화면이 아니라 서버가 확인(백엔드)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="148" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="148" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">

<p><strong>함께 하기</strong></p>

<h2 id="%ED%99%95%EC%9E%A5--%EC%A0%80%EC%9E%A5%ED%95%98%EA%B3%A0-%EA%B3%B5%EA%B0%9C%ED%95%9C%EB%8B%A4">확장 — 저장하고 공개한다</h2>
<p><em>DAY 3</em></p>

<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%8D%B0%EC%9D%B4%ED%84%B0%EB%B2%A0%EC%9D%B4%EC%8A%A4-%EC%9E%85%EB%AC%B8">데이터베이스 입문</h2>
<h3 id="%EB%82%B4-%EB%8D%B0%EC%9D%B4%ED%84%B0%EB%A5%BC-%EC%96%B4%EB%94%94%EC%97%90-%EC%A0%80%EC%9E%A5%ED%95%98%EB%82%98">내 데이터를 어디에 저장하나</h3>

<p>지금까지 앱들은 데이터가 <strong>내 브라우저 안에만</strong> 갇혀 있었습니다. 진짜 서비스로 넘어가려면 <strong>데이터베이스</strong>가 필요합니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="157" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="157" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%A8%BC%EC%A0%80-%EC%98%A4%EB%8A%98-%EB%A7%8C%EB%93%A4-%EC%95%B1%EC%9D%84-%EC%83%81%EC%83%81%ED%95%B4-%EB%B4%85%EC%8B%9C%EB%8B%A4">먼저, 오늘 만들 앱을 상상해 봅시다</h2>
<ul>
<li>잠시 뒤 만들 localStorage 할 일 앱 — 새로고침해도 남습니다(브라우저가 내 컴퓨터에 적어둠)</li>
<li>결정적 한계 — 그 데이터는 &quot;내 브라우저에만&quot;. 다른 기기·다른 사람·다른 브라우저엔 안 보임</li>
<li>localStorage는 혼자 쓰는 개인 메모장 — &quot;친구와 같이&quot;, &quot;어느 기기서든&quot;을 원하면 <strong>모두가 접근하는 한곳</strong> = 데이터베이스</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="158" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="158" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%8D%B0%EC%9D%B4%ED%84%B0%EB%B2%A0%EC%9D%B4%EC%8A%A4%EB%9E%80-%EB%AC%B4%EC%97%87%EC%9D%B8%EA%B0%80">데이터베이스란 무엇인가</h2>
<p>두 가지가 합쳐진 것 — 데이터를 쌓는 <strong>공간</strong> + 안전하게 넣고 꺼내주는 <strong>관리 시스템</strong>.</p>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 비유하면 <strong>거대한 도서관</strong>입니다. 서가(공간)만 있으면 아수라장 — 어디에 뭘 두고 누가 빌렸는지 관리하는 **사서(관리 시스템)**가 있어야 도서관. DB = 저장 공간 + 똑똑한 사서.</p>
</blockquote>
<ul>
<li>사서 덕에 수백만 건이 쌓여도 순식간에 찾고, 동시 요청도 안 뒤엉킴</li>
<li>우리는 &quot;넣어줘 / 꺼내줘&quot;라고 부탁만 — 창고를 직접 뒤질 필요 없음</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="159" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="159" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%91%90-%EC%A2%85%EB%A5%98-%EB%A7%9B%EB%B3%B4%EA%B8%B0--%EA%B4%80%EA%B3%84%ED%98%95-vs-%EB%AC%B8%EC%84%9C%ED%98%95">두 종류 맛보기 — 관계형 vs 문서형</h2>
<table>
<thead>
<tr>
<th></th>
<th>관계형 (SQL)</th>
<th>문서형 (NoSQL)</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>생김새</strong></td>
<td>엑셀 표처럼 행·열이 정해진 칸</td>
<td>자유로운 서류 뭉치</td>
</tr>
<tr>
<td><strong>비유</strong></td>
<td><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ca.svg" data-marp-twemoji=""/> 회계 장부</td>
<td><img class="emoji" draggable="false" alt="🗂️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5c2.svg" data-marp-twemoji=""/> 서류철</td>
</tr>
<tr>
<td><strong>강점</strong></td>
<td>데이터끼리 관계로 연결(회원↔주문)</td>
<td>형식 유연, 빠른 개발</td>
</tr>
<tr>
<td><strong>대표 예</strong></td>
<td>PostgreSQL, MySQL, <strong>Supabase</strong></td>
<td>MongoDB, Firebase</td>
</tr>
</tbody>
</table>
<ul>
<li>다음 세션의 <strong>Supabase는 관계형</strong>(엑셀 표 방식) — 익숙한 표 형태라 이해하기 쉬움</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> [캡처: 관계형(줄 맞춘 엑셀 표) vs 문서형(제각각 서류 카드) 개념 그림]</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="160" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="160" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%8D%B0%EC%9D%B4%ED%84%B0%EB%A1%9C-%ED%95%98%EB%8A%94-%EC%9D%BC%EC%9D%80-%EB%94%B1-4%EA%B0%80%EC%A7%80--crud">데이터로 하는 일은 딱 4가지 — CRUD</h2>
<table>
<thead>
<tr>
<th>동작</th>
<th>뜻</th>
<th>메모 앱에서라면</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>C</strong>reate</td>
<td>새 데이터를 넣는다</td>
<td>새 메모를 쓴다</td>
</tr>
<tr>
<td><strong>R</strong>ead</td>
<td>저장된 데이터를 꺼내 본다</td>
<td>목록을 펼쳐 본다</td>
</tr>
<tr>
<td><strong>U</strong>pdate</td>
<td>기존 데이터를 고친다</td>
<td>메모 내용을 고친다</td>
</tr>
<tr>
<td><strong>D</strong>elete</td>
<td>데이터를 지운다</td>
<td>메모를 버린다</td>
</tr>
</tbody>
</table>
<ul>
<li>이 네 단어면 어떤 앱이든 쪼개어 시킬 수 있다 — 노션 클론도 결국 페이지에 대한 CRUD</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="161" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="161" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%8B%A4%EC%8A%B5--%EC%A0%80%EC%9E%A5%EC%9D%84-%EB%88%88%EC%9C%BC%EB%A1%9C-%ED%95%9C%EA%B3%84%EA%B9%8C%EC%A7%80">실습 — 저장을 눈으로, 한계까지</h2>
<ol>
<li>새 폴더에서 아래 계획 먼저 프롬프트 → 계획 읽고 실행</li>
<li>할 일 3~4개 추가(Create), 목록이 화면에(Read)</li>
<li><strong>핵심</strong> — 새로고침(F5). 방금 쓴 할 일이 그대로 남음 (localStorage 저장)</li>
<li><strong>한계</strong> — 같은 주소를 다른 브라우저/폰에서 열면 텅 빔. &quot;내 브라우저에만 있었구나&quot;</li>
</ol>
<p><strong>EXAMPLE PROMPT (계획 먼저)</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>바로 만들지 말고 계획부터 보여줘. 브라우저의 localStorage를 써서 새로고침해도 목록이 남는
간단한 할 일 앱을 HTML 파일 하나로 만들 거야. 기능은 딱 네 가지 —
할 일 추가, 목록 보기, 완료 체크(수정), 삭제. 계획이 마음에 들면 그때 만들어줘.
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="162" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="162" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="db-%EC%9E%85%EB%AC%B8--%EC%9D%B4-%EC%9E%A5%EC%9D%84-%EB%A7%88%EC%B9%98%EB%A9%B4">DB 입문 — 이 장을 마치면</h2>
<ul>
<li>[ ] DB가 &quot;저장 공간 + 관리 시스템(사서)&quot;이라는 걸 도서관에 비유해 설명할 수 있다</li>
<li>[ ] 관계형·문서형의 차이를 한 문장으로, Supabase가 관계형임을 안다</li>
<li>[ ] CRUD 네 가지가 무엇인지 말할 수 있다</li>
<li>[ ] localStorage로 저장을 확인하고, &quot;내 브라우저에만&quot; 남는 한계를 직접 만나봤다</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> &quot;왜 폰에선 안 보이지?&quot;라는 답답함이 진짜 DB로 넘어가는 출발점입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="163" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="163" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%85%B8%EC%85%98-%ED%81%B4%EB%A1%A0-%EB%A7%8C%EB%93%A4%EA%B8%B0-%EB%94%B0%EB%9D%BC%ED%95%98%EA%B8%B0">노션 클론 만들기 (따라하기)</h2>
<p><em>DAY 3 · 11:00–12:00 · 13:00–14:30 · 따라하기</em></p>
<blockquote>
<p><strong>강사 화면을 따라 함께</strong>. 목표는 전원이 &quot;페이지를 만들고 → 새로고침해도 남아 있는&quot; 화면을 보는 것.</p>
</blockquote>
<blockquote>
<p>(도식: 노션 클론 CRUD 흐름 도식)</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="164" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="164" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%85%B8%EC%85%98%EC%9D%B4-%EB%AD%94%EA%B0%80%EC%9A%94--%EC%98%A4%EB%8A%98-%EB%A7%8C%EB%93%9C%EB%8A%94-%EA%B2%83">노션이 뭔가요 / 오늘 만드는 것</h2>
<ul>
<li>노션 = 문서·메모·할 일·표를 한 곳에서 만드는 올인원 노트 앱 (페이지 안에 페이지, 고치고 지우기)</li>
<li>진짜 노션은 기능이 많지만, 우리는 뼈대 하나만 — 페이지를 만들고 저장하는 부분</li>
<li>오늘 만드는 것 — 페이지를 만들고(C)·보고(R)·수정(U)·삭제(D) 되는 간단한 앱 = CRUD</li>
<li>메모장·가계부·일기·독서기록 전부 같은 CRUD 위에</li>
<li>회원가입·소셜 로그인은 오늘 안 함 (심화로) — CRUD 하나에만 집중</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 앞 세션의 &quot;데이터는 껐다 켜도 남아야 한다&quot;가 눈앞에서 증명 — <strong>껐다 다시 열어도 남는</strong> 순간이 오늘의 하이라이트</p>
</blockquote>
</section>

<ul>
<li>DB가 붙는 앱은 '서버가 도는 프로젝트'라 VS Code로 열고 터미널 명령으로 실행 → 강사 스타터 폴더로 시작</li>
<li>데이터 저장엔 <strong>Supabase</strong>가 필요한데, 각자 가입·프로젝트·테이블·키 발급은 하루로 부족</li>

<blockquote>

<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%94%B0%EB%9D%BC%ED%95%98%EA%B8%B0--%EA%B0%95%EC%82%AC-%ED%99%94%EB%A9%B4%EA%B3%BC-%ED%95%A8%EA%BB%98">따라하기 — 강사 화면과 함께</h2>
<ol>
<li>스타터 열기 — 폴더를 VS Code로 열고 안내된 실행 명령 입력. 빈 시작 화면 뜨면 준비 완료</li>
<li>공용 키 붙이기 — Supabase 주소·키를 설정 파일 정해진 칸에 (앞뒤 공백 주의)</li>
<li>② UI 먼저 — 첫 프롬프트로 화면만 (아직 저장 안 돼도 정상)</li>
<li>③ CRUD 붙이기 — 두 번째 프롬프트로 Supabase 연결</li>
<li>④ 확인 — 페이지 만들고 수정·삭제, 브라우저 껐다 다시 열어 남아 있으면 목표 달성 <img class="emoji" draggable="false" alt="🎉" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f389.svg" data-marp-twemoji=""/></li>
<li>막히면 바로 손들기 — 키 한 글자·공백 하나만 틀려도 멈춤</li>
<li>[각자 5분] 완성했으면 제목 색·폰트 하나만 바꿔보기 — 내 손으로 고쳐보는 게 실력</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="168" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="168" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="example-prompt--%EB%85%B8%EC%85%98-%ED%81%B4%EB%A1%A0-%E2%91%A1-ui--%E2%91%A2-db">EXAMPLE PROMPT — 노션 클론 ② UI / ③ DB</h2>
<p><strong>② UI 먼저 (룩앤필만)</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>노션(https://www.notion.com/ko)과 비슷한 느낌의 &quot;페이지 관리 앱&quot; 화면을 만들어줘.
지금은 기능은 말고 룩앤필만 — 왼쪽에 페이지 목록, 오른쪽에 내용 영역이 있는 깔끔한 화면.
저장 기능은 다음 단계에서. 바로 만들지 말고 계획부터 세워서 보여줘.
</code></pre>
<p><strong>③ DB 연결 (CRUD)</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>이제 이 앱에 데이터베이스를 연결해서, 페이지를 만들고·목록으로 보고·수정·삭제(CRUD)가 되게 해줘.
데이터베이스는 내가 제공한 Supabase 설정(주소·키)을 그대로 사용해줘.
나중에 Vercel 배포까지 할 예정이니 그때 문제가 안 생기는 최신 연결 방법을 인터넷으로 확인해서 적용해줘.
한꺼번에 하지 말고, 계획부터 세워서 보여주고 단계적으로 진행하자.
</code></pre>
<blockquote>
<p>[캡처: 완성된 노션 클론 화면] [캡처: Supabase 테이블에 페이지들이 행으로 쌓인 화면]</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="169" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="169" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%85%B8%EC%85%98-%ED%81%B4%EB%A1%A0--%EC%9E%90%EC%A3%BC-%EB%A7%89%ED%9E%88%EB%8A%94-%EA%B3%B3">노션 클론 — 자주 막히는 곳</h2>
<table>
<thead>
<tr>
<th>증상</th>
<th>해결</th>
</tr>
</thead>
<tbody>
<tr>
<td>저장이 안 됨</td>
<td>Supabase 주소·키, 앞뒤 공백 확인. 두 값 바꿔 넣은 경우 많음</td>
</tr>
<tr>
<td>새로고침하면 사라짐</td>
<td>아직 DB 미연결, 화면에만 임시 — ③ 단계 마쳤는지 확인</td>
</tr>
<tr>
<td>하얀 빈 화면</td>
<td>F12 → Console 빨간 글씨 캡처해 Claude에게</td>
</tr>
<tr>
<td>저장은 되는데 목록에 안 보임</td>
<td>Supabase 대시보드에 데이터 있는지 먼저 → 있으면 Read 부분 문제</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> &quot;새로고침하면 사라진다&quot; vs &quot;껐다 켜도 남는다&quot;의 차이가 바로 DB의 존재 이유. 사라지면 실패가 아니라 신호.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="170" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="170" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%8B%A4%EC%9D%8C%EC%9D%80--%EC%A7%84%EC%A7%9C-%EC%9D%B8%ED%84%B0%EB%84%B7%EC%97%90-%EA%B3%B5%EA%B0%9C">다음은 — 진짜 인터넷에 공개</h2>
<ul>
<li>지금 이 앱은 내 컴퓨터(localhost)에서만 — 나만 볼 수 있는 주소</li>
<li>다음 세션에서 <strong>Vercel</strong>로 배포해 진짜 인터넷 주소로 공개 (친구가 폰에서 열게)</li>
<li>③ 프롬프트에서 &quot;배포까지 고려해 최신 방법으로&quot; 부탁한 이유 — 지금 잘 만들면 배포가 매끄러움</li>
</ul>
<p><strong>이 장을 마치면</strong></p>
<ul>
<li>[ ] 노션처럼 페이지를 만들고·보고·수정·삭제하는 앱을 움직여봤다</li>
<li>[ ] 껐다 켜도 데이터가 남는 것을 확인 — DB가 왜 필요한지 실감</li>
<li>[ ] 공용 Supabase를 붙여봤고, 혼자 할 땐 무엇이 더 필요한지 안다</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="171" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="171" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="vercel-%EB%B0%B0%ED%8F%AC">Vercel 배포</h2>
<h3 id="db-%EB%B6%99%EC%9D%80-%EC%95%B1%EC%9D%84-%EC%9D%B8%ED%84%B0%EB%84%B7%EC%97%90-%EA%B3%B5%EA%B0%9C">DB 붙은 앱을 인터넷에 공개</h3>
<p><em>DAY 3 · 14:40–15:50 · 이론+실습</em></p>
<blockquote>
<p>앞 세션의 노션 클론은 아직 <strong>내 컴퓨터 안에서만</strong> 열립니다. 이번엔 진짜 인터넷 주소에 올립니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="172" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="172" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%A7%80%EA%B8%88-%EC%83%81%ED%83%9C--localhost%EB%8A%94-%EB%82%98%EB%A7%8C-%EB%B3%B8%EB%8B%A4">지금 상태 — localhost는 나만 본다</h2>
<ul>
<li>노션 클론 실행하면 <code>localhost:3000</code> — localhost = 바로 이 컴퓨터. 옆 사람에게 보내도 안 열림</li>
<li>Day 1의 프로필처럼 인터넷에 올릴 차례 — 그런데 이 앱은 DB가 붙어 방법이 조금 다름</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="173" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="173" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%A0%95%EC%A0%81-vs-%EB%8F%99%EC%A0%81-%EB%B0%B0%ED%8F%AC--%EC%99%9C-github-pages%EB%A1%9C%EB%8A%94-%EC%95%88-%EB%90%98%EB%82%98">정적 vs 동적 배포 — 왜 GitHub Pages로는 안 되나</h2>
<table>
<thead>
<tr>
<th></th>
<th>정적(static)</th>
<th>동적(dynamic)</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>어떤 앱</strong></td>
<td>Day 1 프로필 (HTML만)</td>
<td>노션 클론 (DB·서버)</td>
</tr>
<tr>
<td><strong>필요한 것</strong></td>
<td>파일만 있으면 됨</td>
<td>요청마다 서버가 DB 읽고 씀</td>
</tr>
<tr>
<td><strong>배포 수단</strong></td>
<td>GitHub Pages</td>
<td>GitHub Pages 불가 → <strong>Vercel</strong></td>
</tr>
<tr>
<td><strong>비유</strong></td>
<td>인쇄된 포스터</td>
<td>응대하는 사람이 있는 가게</td>
</tr>
</tbody>
</table>
<ul>
<li>GitHub Pages는 완성 파일만 보여줌 — &quot;저장하면 DB에 넣어라&quot; 같은 일을 시킬 서버가 없음</li>
<li>그래서 동적 앱은 서버를 굴려주는 배포 서비스 = Vercel</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="174" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="174" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="vercel--github%EB%A7%8C-%EC%97%B0%EA%B2%B0%ED%95%98%EB%A9%B4-%EC%95%8C%EC%95%84%EC%84%9C">Vercel — GitHub만 연결하면 알아서</h2>
<ul>
<li>Vercel(vercel.com) = GitHub 저장소를 연결하면 자동 빌드·배포, 서버까지 준비</li>
<li>무료로 시작 — 개인 프로젝트·오늘의 노션 클론은 무료 범위로 충분</li>
<li>한 번 연결하면 이후엔 GitHub에 푸시만 하면 알아서 재배포</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Day 1의 **커밋(포장)·푸시(발송)**가 그대로. Vercel은 발송된 택배를 받아 진열대에 올려주는 <strong>배달 대행</strong>.</p>
</blockquote>
</section>

<h2 id="%EB%B0%B0%ED%8F%AC-4%EB%8B%A8%EA%B3%84--%ED%81%B0-%EA%B7%B8%EB%A6%BC">배포 4단계 — 큰 그림</h2>

<tr>

<tr>

<td>코드 아니라 Vercel에</td>
</tr>
<tr>

<td>Deploy 후 주소 열기</td>

</tr>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="176" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="176" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%E2%91%A2-%ED%99%98%EA%B2%BD%EB%B3%80%EC%88%98--%ED%82%A4%EB%8A%94-%EC%BD%94%EB%93%9C%EC%97%90-%EB%84%A3%EC%A7%80-%EC%95%8A%EB%8A%94%EB%8B%A4">③ 환경변수 — 키는 코드에 넣지 않는다</h2>
<blockquote>
<p>Day 1의 &quot;API 키는 환경변수로 보관&quot;을 실제로 씁니다. 노션 클론은 DB 접속에 비밀 키가 필요한데, 코드에 적으면 안 됩니다.</p>
</blockquote>
<ul>
<li>환경변수 = 실행 때 읽어가는 바깥에 붙여둔 설정 메모. 코드는 &quot;그 메모를 읽어&quot; 사용</li>
<li>왜 — 코드에 박으면 GitHub 올리는 순간 키까지 공개, 남이 내 DB를 열 수 있음</li>
<li>그래서 Vercel의 Environment Variables 칸에 등록 — 코드엔 &quot;여기서 읽어와&quot; 표시만, 진짜 값은 Vercel이 보관</li>
</ul>
<table>
<thead>
<tr>
<th>흔히 넣는 환경변수</th>
<th>무엇</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>NEXT_PUBLIC_SUPABASE_URL</code></td>
<td>내 Supabase 프로젝트 주소</td>
</tr>
<tr>
<td><code>NEXT_PUBLIC_SUPABASE_ANON_KEY</code></td>
<td>Supabase 접속용 공개 키</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 어떤 이름이 필요한지는 프로젝트마다 다름 — 외우지 말고 Claude에게 물어보기</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="177" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="177" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%A7%89%ED%9E%88%EB%A9%B4-claude%EC%97%90%EA%B2%8C--%EC%A0%88%EC%B0%A8-%ED%86%B5%EC%A7%B8%EB%A1%9C">막히면 Claude에게 — 절차 통째로</h2>
<p>비개발자는 화면(GUI)만으로 충분히 배포할 수 있습니다.</p>
<p><strong>EXAMPLE PROMPT (환경변수 확인)</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>이 프로젝트를 Vercel에 배포하려고 해.
내 코드를 읽고, 배포하려면 어떤 환경변수가 필요한지 이름과 함께 알려줘.
그리고 그 값들을 각각 어디서 구하는지도 설명해줘.
</code></pre>
<p><strong>EXAMPLE PROMPT (배포 절차 안내)</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>이 노션 클론을 Vercel에 처음 배포하려고 해.
GitHub에 올리는 것부터 Vercel 연결, 환경변수 등록, 배포까지
비개발자가 따라 할 수 있게 화면 클릭 위주로 단계별로 안내해줘.
</code></pre>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 개발자는 Vercel CLI를 쓰기도 — 오늘은 웹 화면 클릭만으로 끝까지.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="178" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="178" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%94%B0%EB%9D%BC%ED%95%98%EA%B8%B0--%EB%85%B8%EC%85%98-%ED%81%B4%EB%A1%A0%EC%9D%84-vercel%EC%97%90">따라하기 — 노션 클론을 Vercel에</h2>
<ol>
<li>GitHub에 올리기 — &quot;이 프로젝트를 GitHub에 새 저장소로 올려줘&quot; (Day 1 그대로)</li>
<li>vercel.com → Continue with GitHub 로그인 (별도 가입 불필요)</li>
<li>Add New… → Project → 저장소 Import [캡처: Vercel 프로젝트 연결]</li>
<li>Environment Variables 칸에 이름·값(Supabase URL·키) 하나씩 → Add [캡처: 환경변수 설정]</li>
<li>Deploy 누르고 대기 — 자동 빌드·서버 올림</li>
<li><code>내프로젝트.vercel.app</code> 주소 열고 폰으로도 — 저장했다 새로고침해도 남으면 성공 [캡처: 배포 완료 주소]</li>
<li>옆 사람에게 주소 보내 서로의 노션 클론에 글 남기기</li>
</ol>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 혼자 해보기 — 나만의 기능 하나(날짜 표시, 검색창) 붙이고 커밋·푸시하면 Vercel이 자동 재배포</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="179" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="179" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%B3%B4%EC%95%88--%ED%82%A4%EA%B0%80-github%EC%97%90-%EC%98%AC%EB%9D%BC%EA%B0%80%EB%A9%B4">보안 — 키가 GitHub에 올라가면</h2>
<ul>
<li>키·시크릿은 절대 코드에 직접 적지 말고 환경변수로 — 이 하나만 지켜도 대부분의 사고를 막음</li>
<li>실수로 올라가면 Supabase·구글이 감지해 자동 무효화하기도 → 앱이 갑자기 멈추는 원인</li>
<li>이미 올라갔다면 — &quot;이 키를 코드에서 빼고 환경변수로 바꿔줘. 새 키로 교체하는 방법도 알려줘&quot;</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="180" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="180" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">

<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="vercel--%EC%9D%B4-%EC%9E%A5%EC%9D%84-%EB%A7%88%EC%B9%98%EB%A9%B4">Vercel — 이 장을 마치면</h2>
<ul>
<li>[ ] 정적(GitHub Pages)·동적(Vercel) 배포가 왜 다른지 한 문장으로</li>

<li>[ ] Supabase 키를 코드가 아니라 Vercel 환경변수에 등록했다</li>
<li>[ ] 키를 코드에 넣으면 왜 위험한지 알고, 옆 사람과 링크를 주고받아봤다</li>
</ul>

</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="184" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="184" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%88%98%EA%B0%95-%EC%A0%84-%EC%A4%80%EB%B9%84-%EC%B2%B4%ED%81%AC%EB%A6%AC%EC%8A%A4%ED%8A%B8">수강 전 준비 체크리스트</h2>
<p><em>부록</em></p>
<blockquote>
<p>아래는 <strong>수업 전날까지</strong> 완료. 특히 공공데이터포털은 승인에 시간이 걸리니 꼭 미리!</p>
</blockquote>
<ul>
<li>[ ] GitHub 계정 (github.com) — Day 1 오후 배포용</li>
<li>[ ] Google 계정 + Google Cloud 콘솔 로그인 확인 — Day 2 API 키 발급용</li>
<li>[ ] 공공데이터포털(data.go.kr) 가입 + 관심 API 활용신청 미리 (승인 시간 걸림)</li>
<li>[ ] Claude 유료 구독(Pro 이상) — 무료론 클로드 코드 불가</li>
<li>[ ] VS Code / Node.js LTS / Git / Python 설치 (부록 「설치 상세 가이드」)</li>
<li>[ ] Claude Code 설치 — 주력 도구 (설치·환경변수는 상세 가이드)</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 막히는 항목이 있어도 첫날 아침에 함께 해결. 단 <strong>공공데이터포털 활용신청만은 꼭 미리</strong>.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="185" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="185" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%84%A4%EC%B9%98-%EC%83%81%EC%84%B8-%EA%B0%80%EC%9D%B4%EB%93%9C--%EB%8F%84%EA%B5%AC-4%EC%A2%85">설치 상세 가이드 — 도구 4종</h2>
<p><em>부록</em></p>
<blockquote>
<p>이름만 봤던 도구들을 실제로 설치하는 화면 단위 절차. 막히면 그 도구의 <strong>버전 확인 명령</strong>부터.</p>
</blockquote>
<p><strong>시작 전에 — &quot;터미널&quot;이란?</strong></p>
<ul>
<li>컴퓨터에 글자로 명령을 내리는 검은 창 (설치 확인용)</li>
<li>윈도우: 시작 → terminal/PowerShell / 맥: command+space → terminal</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 버전 확인 시 숫자(<code>v22.11.0</code>)면 성공, &quot;not recognized&quot;면 미설치이거나 <strong>터미널을 새로 켜야</strong> 함.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="186" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="186" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%E2%91%A0-nodejs--%EC%9B%B9%ED%81%B4%EB%A1%9C%EB%93%9C-%EC%BD%94%EB%93%9C%EC%9D%98-%EA%B8%B0%EB%B3%B8-%EC%97%94%EC%A7%84">① Node.js — 웹·클로드 코드의 기본 엔진</h2>
<blockquote>
<p>클로드 코드를 설치하려면 Node.js가 먼저 있어야 합니다.</p>
</blockquote>
<ol>
<li><a href="https://nodejs.org">https://nodejs.org</a> → &quot;LTS&quot; 버튼 (안정 버전) [캡처: LTS 버튼 강조]</li>
<li>설치 파일 더블클릭 → Next 계속 → Install/Finish</li>
<li>&quot;Tools for Native Modules&quot; 나와도 기본값으로 Next</li>
<li>버전 확인 — 터미널 새로 열고 아래 [캡처: node -v, npm -v 결과]</li>
</ol>
<table>
<thead>
<tr>
<th>명령</th>
<th>확인</th>
<th>정상 예시</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>node -v</code></td>
<td>Node.js 버전</td>
<td><code>v22.11.0</code></td>
</tr>
<tr>
<td><code>npm -v</code></td>
<td>npm 버전</td>
<td><code>10.9.0</code></td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <code>npm</code>은 Node.js 설치 시 자동으로 함께 깔립니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="187" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="187" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%E2%91%A1-git--%EC%BD%94%EB%93%9C-%EC%A0%80%EC%9E%A5%EB%B0%B0%ED%8F%AC-%EB%8F%84%EA%B5%AC">② Git — 코드 저장·배포 도구</h2>
<blockquote>
<p>Day 1 오후 배포에 씁니다. 미리 깔아두세요.</p>
</blockquote>
<ol>
<li><a href="https://git-scm.com/downloads">https://git-scm.com/downloads</a> → 본인 OS 클릭 → 다운로드 [캡처: git-scm 다운로드]</li>
<li>설치(윈도우) — 옵션 화면 전부 기본값 Next → Install</li>
<li>설치(맥) — 보통 이미 있음. 버전 확인되면 추가 설치 불필요</li>
<li>버전 확인 — 터미널에서 <code>git --version</code> → <code>git version 2.47.0</code>처럼 나오면 성공</li>
</ol>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 윈도우 설치 중 &quot;기본 에디터 선택&quot;이 나와도 <strong>기본값으로 두고 Next</strong>.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="188" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="188" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%E2%91%A2-python--%EC%B2%B4%ED%81%AC%EB%B0%95%EC%8A%A4-%ED%95%98%EB%82%98%EA%B0%80-%ED%95%B5%EC%8B%AC">③ Python — 체크박스 하나가 핵심</h2>
<blockquote>
<p>설치 자체보다 <strong>체크박스 하나</strong>가 더 중요합니다.</p>
</blockquote>
<ol>
<li><a href="https://www.python.org/downloads/">https://www.python.org/downloads/</a> → 노란 &quot;Download Python 3.x&quot; [캡처: python.org]</li>
<li><strong>가장 중요</strong> — 설치 첫 화면 아래 <strong>&quot;Add Python to PATH&quot;</strong> 반드시 먼저 체크 [캡처: 체크한 화면]</li>
<li>체크 확인 후 &quot;Install Now&quot; → Close</li>
<li>버전 확인 — <code>python --version</code> → <code>Python 3.13.1</code> (맥은 <code>python3 --version</code>)</li>
</ol>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 깜빡했다면? 설치 파일 다시 실행 → <strong>&quot;Modify&quot;</strong> → PATH 옵션 켜고 진행. 처음부터 다시 깔 필요 없음.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="189" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="189" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%E2%91%A3-claude-code--%EC%9D%B4-%EC%88%98%EC%97%85%EC%9D%98-%EC%A3%BC%EB%A0%A5-%EB%8F%84%EA%B5%AC">④ Claude Code — 이 수업의 주력 도구</h2>
<blockquote>
<p>①~③이 끝나야 설치 가능. 특히 <strong>Node.js가 먼저</strong>, 유료 Claude 구독도 필요.</p>
</blockquote>
<p><strong>(a) 설치 전 준비</strong> — <code>node -v</code> 확인 / 유료 구독으로 claude.com 로그인 확인<br />
<strong>(b) 설치</strong> — Day 1 「개발환경 구성」에서 PowerShell 네이티브 설치(<code>%USERPROFILE%\.local\bin</code>)</p>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> [확인 필요: 클로드 코드 공식 설치 명령 — 최신 형태를 docs.claude.com에서 확정. 네이티브(PowerShell)·npm(<code>@anthropic-ai/claude-code</code>) 두 방식 가능]</p>
</blockquote>
<ul>
<li>설치 후 <code>claude --version</code> → 버전 나오면 성공 / 실행은 프로젝트 폴더에서 <code>claude</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="190" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="190" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%E2%91%A3-claude-code--%ED%99%98%EA%B2%BD%EB%B3%80%EC%88%98path-%EC%B6%94%EA%B0%80">④ Claude Code — 환경변수(PATH) 추가</h2>
<blockquote>
<p><code>claude</code> 명령을 &quot;찾을 수 없다&quot;고 나올 때만.</p>
</blockquote>
<ol>
<li>시작 → 환경 변수 검색 → &quot;시스템 환경 변수 편집&quot;</li>
<li>&quot;시스템 속성&quot; 창 아래 &quot;환경 변수(N)...&quot; 버튼</li>
<li>&quot;사용자 변수&quot;에서 &quot;Path&quot; → &quot;편집(E)...&quot; [캡처: Path 선택 상태]</li>
<li>&quot;새로 만들기(N)&quot; → <code>%USERPROFILE%\.local\bin</code> 붙여넣기</li>
<li>모든 창 &quot;확인&quot; → 터미널 완전히 껐다 새로 열고 <code>claude --version</code> 재시도</li>
</ol>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 혼자 씨름하지 말고 화면을 캡처해 강사에게 보이거나, Claude에게 물어보세요. 대부분 5분.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="191" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="191" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%84%A4%EC%B9%98-%EA%B0%80%EC%9D%B4%EB%93%9C--%EC%9D%B4-%EC%9E%A5%EC%9D%84-%EB%A7%88%EC%B9%98%EB%A9%B4">설치 가이드 — 이 장을 마치면</h2>
<ul>
<li>[ ] <code>node -v</code> · <code>npm -v</code>가 버전을 출력한다</li>
<li>[ ] <code>git --version</code>이 버전을 출력한다</li>
<li>[ ] <code>python --version</code>이 버전을 출력한다 (&quot;Add Python to PATH&quot; 체크함)</li>
<li>[ ] <code>claude --version</code>이 나오고, <code>claude</code>로 클로드 코드가 실행된다</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="192" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="192" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="ai%EA%B0%80-%EB%A7%8C%EB%93%A0-%EA%B2%83-%EA%B2%80%EC%A6%9D%ED%95%98%EA%B8%B0">AI가 만든 것 검증하기</h2>
<p><em>부록</em></p>
<blockquote>
<p>이론 03에서 못 박았듯 도구를 붙여도 AI는 틀릴 수 있습니다. 코드를 못 읽어도 <strong>확인할 수는 있습니다.</strong></p>
</blockquote>
<p><strong>핵심 원칙 — 코드를 읽는 대신, 동작을 확인한다</strong></p>
<ul>
<li>인테리어 업체가 &quot;끝났습니다!&quot; 해도 수도·문·콘센트를 확인 — 도면 못 읽어도 검수는 가능</li>
<li>코드를 한 줄도 못 읽어도 동작을 확인하는 방법은 다섯 가지</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="193" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="193" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%B0%A9%EB%B2%95-1--%EC%84%A4%EB%AA%85%EC%8B%9C%ED%82%A4%EA%B8%B0">방법 1 — 설명시키기</h2>
<p>검증의 첫 수단은 코드가 아니라 <strong>말</strong>입니다. 설명이 시킨 것과 다르면 바로 수정 요청.</p>
<p><strong>EXAMPLE PROMPT</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>방금 만든 코드를 비개발자한테 설명하듯이 알려줘.
- 어떤 파일을 만들었거나 수정했는지
- 각각 무슨 역할인지
- 사용자 입장에서 뭐가 달라지는지
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="194" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="194" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%B0%A9%EB%B2%95-2--%EC%9D%B4%EC%83%81%ED%95%9C-%EC%9E%85%EB%A0%A5%EC%9D%84-%EB%84%A3%EC%96%B4%EB%B3%B8%EB%8B%A4">방법 2 — 이상한 입력을 넣어본다</h2>
<ul>
<li>일부러 틀리게 — 가격 칸에 &quot;만원&quot; 글자, 필수 항목 비우고 저장, 아주 긴 글 붙여넣기</li>
<li>문제를 찾으면 Day 1의 기대 vs 실제 형식으로 신고</li>
</ul>
<p><strong>EXAMPLE PROMPT (문제 신고)</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>현재 상황: 가격에 &quot;만원&quot;이라고 글자를 입력했어.
결과: 에러 없이 등록되는데 가격이 &quot;NaN원&quot;으로 표시돼.
원하는 결과: 숫자만 입력 가능해야 하고, 글자를 넣으면 경고가 떠야 해.
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="195" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="195" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%B0%A9%EB%B2%95-3--%EB%8B%A4%EB%A5%B8-ai%EC%97%90%EA%B2%8C-%ED%81%AC%EB%A1%9C%EC%8A%A4%EC%B2%B4%ED%81%AC">방법 3 — 다른 AI에게 크로스체크</h2>
<p>내가 판단할 필요 없이 <strong>AI들끼리 검증하게</strong> 만드는 방법.</p>
<table>
<thead>
<tr>
<th>순서</th>
<th>할 일</th>
</tr>
</thead>
<tbody>
<tr>
<td>①</td>
<td>Claude에게 &quot;결제 관련 코드 보여줘&quot;</td>
</tr>
<tr>
<td>②</td>
<td>다른 AI(ChatGPT·Gemini)에 붙여넣고 &quot;보안 문제·버그 없는지 확인&quot;</td>
</tr>
<tr>
<td>③</td>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code>이 프로젝트 보안 점검해줘:

</code></pre>

<tr>

</tr>
<tr>

</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 답은 <strong>둘 다</strong> — AI에게 기본 점검, 내가 직접 써보며 느낌 확인.</p>
</blockquote>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="209" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="209" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%A7%89%ED%98%94%EC%9D%84-%EB%95%8C-%EC%9D%91%EA%B8%89%EC%B2%98%EC%B9%98">막혔을 때 응급처치</h2>
<p><em>부록</em></p>
<blockquote>
<p>시간을 잡아먹는 건 개발이 아니라 가입·설치·연결. <strong>막히는 것은 여러분 잘못이 아닙니다.</strong></p>
</blockquote>
<p><strong>무조건 먼저 해볼 3가지</strong></p>
<ul>
<li>① 에러 메시지(화면)를 그대로 복사/캡처 → &quot;이 에러 해결해줘&quot;</li>
<li>② 새 대화 열고 다시 시키기 — 길어지면 판단이 흐려짐</li>
<li>③ 프로그램(터미널·VS Code) 완전히 껐다 켜기 — &quot;반영 안 됨&quot;의 절반은 재시작</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 막힘 3대 원인 — ① 계정 ② 연결 ③ 재시작 안 함. 이 순서로 점검.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="210" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="210" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%9D%91%EA%B8%89%EC%B2%98%EC%B9%98--%EC%84%A4%EC%B9%98--%EB%AA%85%EB%A0%B9%EC%96%B4">응급처치 — 설치 · 명령어</h2>
<table>
<thead>
<tr>
<th>증상</th>
<th>해결</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>claude</code> 못 찾음</td>
<td>터미널 새로 열기 → PC 재시작 → Path에 <code>%USERPROFILE%\.local\bin</code></td>
</tr>
<tr>
<td>설치 명령이 안 먹힘</td>
<td>한 글자도 빼지 말고 그대로 복사했는지</td>
</tr>
<tr>
<td>로그인 브라우저 안 열림</td>
<td>터미널의 URL을 직접 복사해 주소창에</td>
</tr>
<tr>
<td>GitHub 가입 안 넘어감</td>
<td>스마트폰으로 가입 후 PC 로그인, 인증 코드는 복붙</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="211" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="211" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%9D%91%EA%B8%89%EC%B2%98%EC%B9%98--github-pages-%EB%B0%B0%ED%8F%AC">응급처치 — GitHub Pages 배포</h2>
<table>
<thead>
<tr>
<th>증상</th>
<th>해결</th>
</tr>
</thead>
<tbody>
<tr>

</tr>
<tr>

</tr>
<tr>
<td>Pages 메뉴 못 켬</td>
<td>Private이기 때문 — Settings → General → <strong>Public</strong></td>
</tr>
<tr>
<td>모양이 깨짐</td>
<td>&quot;CSS 파일 경로 확인해줘&quot; (대소문자 불일치가 흔함)</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="212" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="212" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%9D%91%EA%B8%89%EC%B2%98%EC%B9%98--api--%EA%B2%B0%EC%A0%9C--%EA%B3%B5%ED%86%B5">응급처치 — API · 결제 / 공통</h2>

<thead>
<tr>
<th>증상</th>
<th>해결</th>
</tr>
</thead>
<tbody>
<tr>

<table>
<thead>
<tr>
<th>증상</th>
<th>해결</th>
</tr>
</thead>
<tbody>
<tr>
<td>하얀 빈 화면</td>

</tr>
<tr>
<td>3번 고쳤는데 계속 실패</td>
<td>&quot;다른 방식으로&quot; 또는 그 부분만 처음부터</td>
</tr>
<tr>
<td>아까는 됐는데 안 됨</td>
<td>완전 종료 후 재시작</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 그래도 안 되면 <strong>손 들기</strong> — 여러분이 막힌 곳은 다음 사람도 막힙니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="213" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="213" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>

<h3 id="ai%EB%A5%BC-%EB%8D%94-%EC%9E%98-%EB%B6%80%EB%A6%AC%EB%8A%94-%EA%B8%B0%EC%88%A0">AI를 더 잘 부리는 기술</h3>
<p><em>부록</em></p>
<blockquote>
<p>&quot;하네스&quot;는 말을 부릴 때 쓰는 장비. AI를 더 안전하고 정확하게 부리는 세팅과 습관.</p>
</blockquote>
<p><strong>핵심 개념 — &quot;부탁&quot;과 &quot;강제&quot;</strong></p>
<table>
<thead>
<tr>
<th></th>
<th>CLAUDE.md 규칙</th>
<th>훅(hook)</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>성격</strong></td>
<td>부탁</td>
<td>강제</td>
</tr>
<tr>
<td><strong>지켜지는 정도</strong></td>
<td>거의 항상 (확률)</td>
<td>무조건 100% (자동 실행)</td>
</tr>
<tr>
<td><strong>어울리는 일</strong></td>
<td>말투, 스타일, 코딩 규칙</td>
<td>반드시 일어나야 하는 검사·차단</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="214" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="214" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>

<thead>
<tr>
<th>기술</th>
<th>무엇을</th>
<th>예시</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>권한 설정</strong></td>
<td>AI가 스스로 해도 되는 범위</td>
<td>&quot;만들고 고치는 건 알아서, 지우는 건 물어보고&quot;</td>
</tr>
<tr>
<td><strong>계획 모드</strong></td>
<td>실행 전 계획을 받아 검토</td>
<td>읽고 고친 뒤 실행</td>
</tr>
<tr>
<td><strong>작업 쪼개기</strong></td>
<td>큰 요청 1개 → 작은 여러 개</td>
<td>&quot;쇼핑몰&quot; 1번보다 &quot;목록→장바구니→결제&quot; 3번</td>
</tr>
<tr>
<td><strong>서브에이전트</strong></td>

<td>30분 일이 10분에 (오늘은 개념만)</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="215" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="215" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EB%A7%A1%EA%B8%B8%EA%B9%8C-%EB%A7%90%EA%B9%8C--%EC%9C%84%EC%9E%84-%ED%8C%90%EB%8B%A8-3%EC%A7%88%EB%AC%B8">맡길까 말까 — 위임 판단 3질문</h2>

<tr>

</tr>
<tr>
<td><strong>규칙이 분명한가?</strong></td>
<td>&quot;이 형식으로 정리해줘&quot;</td>
<td>정답 없는 가치 판단</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 결제 예 — 연동 코드는 맡기고, 실제 돈이 오가는 최종 확인은 사람이. 최종 책임은 사람에게.</p>
</blockquote>
</section>

<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%ED%95%98%EB%84%A4%EC%8A%A4--%EC%8B%A4%EC%8A%B5--%EC%9D%B4-%EC%9E%A5%EC%9D%84-%EB%A7%88%EC%B9%98%EB%A9%B4">하네스 — 실습 &amp; 이 장을 마치면</h2>

<ol>
<li>새 폴더를 만들고 CLAUDE.md를 미리 작성 (어제 배운 것 활용)</li>
<li>계획 모드로 &quot;오늘 만들 것&quot;의 계획을 받아 마음에 안 드는 부분 고치기</li>
</ol>
<p><strong>이 장을 마치면</strong></p>
<ul>
<li>[ ] 프로젝트용 폴더와 CLAUDE.md가 준비돼 있다</li>
<li>[ ] 계획 모드로 계획을 한 번 받아 고쳐봤다</li>
</ul>

<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%84%A4%EC%B9%98%EB%90%98%EB%8A%94-%EC%9B%B9%EC%95%B1--%ED%95%B5%EC%8B%AC-%EB%82%B4%EC%9A%A9">설치되는 웹앱 — 핵심 내용</h2>

<li>홈 화면에 설치되고 전체화면으로 열리는 웹 — 아이콘으로 실행하면 겉보기엔 일반 앱과 거의 같음</li>
<li>필요한 것은 둘 — <strong>manifest</strong>(앱 이름·아이콘) + <strong>서비스워커</strong>(설치를 가능하게). 둘 다 Claude가 만듦</li>
<li>조건 하나 — <strong>https 주소</strong>에서만 설치. GitHub Pages는 자동 https라 어제 배포한 그대로면 이미 갖춰짐</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="220" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="220" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">

<table>
<thead>
<tr>

<th>앱스토어 앱</th>
</tr>

<tbody>
<tr>
<td><strong>배포</strong></td>
<td>심사·등록 없이 즉시</td>
<td>스토어 심사 (며칠~몇 주)</td>
</tr>
<tr>
<td><strong>설치</strong></td>

<td>스토어에서 다운로드</td>
</tr>
<tr>
<td><strong>수정 반영</strong></td>
<td>재배포하면 즉시</td>
<td>업데이트 심사 후</td>
</tr>
<tr>
<td><strong>폰 기능</strong></td>

</ul>
</section>

<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%8B%A4%EC%8A%B5--%ED%94%84%EB%A1%9C%ED%95%84-%ED%8E%98%EC%9D%B4%EC%A7%80%EB%A5%BC-%EC%95%B1%EC%9C%BC%EB%A1%9C">실습 — 프로필 페이지를 앱으로</h2>
<ol>
<li>Day 1 프로필 폴더를 열고 아래 프롬프트 전송</li>
<li>바뀐 파일들을 깃허브에 다시 올림 (Day 1 배포와 같은 방법)</li>
<li>폰 브라우저로 내 주소 → 안드로이드(크롬): 메뉴(⋮) → 홈 화면에 추가 / 아이폰: <strong>꼭 사파리로</strong> → 공유 → 홈 화면에 추가</li>
<li>홈 화면 아이콘을 눌러 전체화면으로 열리면 성공</li>
</ol>
<p><strong>EXAMPLE PROMPT</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>이 프로필 페이지를 홈 화면에 설치되는 웹앱으로 만들어줘.
홈 화면에 설치할 수 있게 manifest와 서비스워커를 추가하고,
앱 이름은 &quot;OO의 프로필&quot;, 아이콘도 간단하게 만들어줘.
</code></pre>
</section>

<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="ms-clarity">MS Clarity</h2>
<h3 id="%EC%8B%A4%EC%82%AC%EC%9A%A9%EC%9E%90%EB%8A%94-%EB%82%B4-%EC%84%9C%EB%B9%84%EC%8A%A4%EB%A5%BC-%EC%96%B4%EB%96%BB%EA%B2%8C-%EC%93%B0%EB%8A%94%EA%B0%80">실사용자는 내 서비스를 어떻게 쓰는가</h3>
<p><em>부록</em></p>
<blockquote>
<p>&quot;만들었다&quot;에서 끝나지 않고, 사람들이 실제로 어떻게 쓰는지 보고 고치는 것 — 그게 서비스 운영입니다.</p>
</blockquote>
<blockquote>
<p>(도식: Clarity 사용자 추적 흐름 도식)</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="224" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="224" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="ms-clarity--%ED%95%B5%EC%8B%AC-%EB%82%B4%EC%9A%A9">MS Clarity — 핵심 내용</h2>
<ul>
<li>MS Clarity = 마이크로소프트가 무료 제공하는 사용자 행동 분석 도구. 어디를 누르고·어디까지 읽고·어디서 나가는지</li>
<li>오늘 시연은 미리 설치해 데이터가 쌓인 사이트로 — 설치 후 대시보드에 뜨기까지 수십 분~수 시간 (내 데이터는 내일 확인)</li>
</ul>
<table>
<thead>
<tr>
<th>기능</th>
<th>보여주는 것</th>
<th>보고 나서 할 일</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>히트맵</strong></td>
<td>많이 클릭된 곳일수록 빨갛게</td>
<td>아무도 안 누르는 버튼 없앰</td>
</tr>
<tr>
<td><strong>세션 녹화</strong></td>
<td>방문자 쓰는 모습을 영상처럼</td>
<td>이탈하는 지점 고침</td>
</tr>
<tr>
<td><strong>분노의 클릭</strong></td>
<td>안 되는 버튼 연타 흔적</td>
<td>고장·헷갈리는 버튼 고침</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="225" data-paginate="true" data-header="비개발자를 위한 바이브코딩 입문" data-theme="default" lang="ko-KR" data-marpit-pagination="225" style="--paginate:true;--header:비개발자를 위한 바이브코딩 입문;--theme:default;" data-marpit-pagination-total="225" data-size="16:9">
<header>비개발자를 위한 바이브코딩 입문</header>
<h2 id="%EC%8B%A4%EC%8A%B5--%EB%82%B4-%EC%82%AC%EC%9D%B4%ED%8A%B8%EC%97%90-%EC%84%A4%EC%B9%98">실습 — 내 사이트에 설치</h2>
<ol>
<li>clarity.microsoft.com → 마이크로소프트/구글 계정 가입</li>
<li>새 프로젝트 → 이름·배포 주소 입력 → 설정 → 설치 → &quot;직접 설치&quot; 탭의 추적 코드 통째로 복사</li>
<li>Claude에게 &quot;이 스크립트를 내 페이지의 head에 넣어줘&quot; + 코드 붙여넣기</li>
<li>깃허브에 다시 올려 재배포 — 데이터는 오늘 저녁~내일 대시보드에서</li>
</ol>
<p><strong>이 장을 마치면</strong></p>
<ul>
<li>[ ] 추적 코드가 들어간 내 사이트가 다시 배포돼 있다</li>
<li>[ ] 내일 대시보드에서 무엇을 볼지(히트맵·세션 녹화) 안다</li>
</ul>
<p><strong>참고 자료</strong> — MS Clarity (가입·대시보드) / Clarity 공식 문서</p>
